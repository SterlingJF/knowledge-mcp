<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
<title id="title">Before drafting a proposal, the agent asks the questions the proposal requires</title>
<desc id="description">The team needs approval to change tools. Switching back will be costly. Before drafting, the agent identifies the reviewer and purpose. Approval requires the question about imposed limits. Costly reversal requires the question about work order. The proposal draws on the problem statement and risk notes. The agent checks gaps, then drafts.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 9 6 L 2 10" fill="none" stroke="#456354" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #172c23; }
  .title { font-size: 40px; font-weight: 700; letter-spacing: -.4px; }
  .request { font-size: 26px; font-weight: 400; fill: #46574c; }
  .question { font-size: 30px; font-weight: 500; }
  .label { font-size: 16px; font-weight: 600; letter-spacing: 1.4px; fill: #566e60; }
  .condition { font-size: 26px; font-weight: 400; fill: #476151; }
  .detail { font-size: 22px; font-weight: 400; fill: #5b695f; }
  .arrow { fill: none; stroke: #456354; stroke-width: 2; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
  .rule { fill: none; stroke: #e1e8df; stroke-width: 1; }
</style>
<rect width="1280" height="640" fill="#fffaf0"/>

<text x="48" y="80" class="title">Before the agent drafts a proposal</text>
<text x="48" y="112" class="label">YOU ASK</text>
<rect x="48" y="128" width="1184" height="112" rx="16" fill="#ffffff" stroke="#d4ddd1" stroke-width="1.5"/>
<text x="72" y="176" class="request">Draft a proposal to move our team to a new tool.</text>
<text x="72" y="208" class="request">We need approval. Moving back will be costly.</text>

<path class="arrow" d="M 808 248 V 280"/>
<text x="840" y="272" class="detail">knowledge-mcp supplies the questions.</text>
<text x="384" y="272" class="label">BEFORE DRAFTING</text>

<rect x="384" y="288" width="848" height="240" rx="16" fill="#ffffff" stroke="#cbd9ca" stroke-width="1.5"/>
<text x="416" y="332" class="detail">For a reviewer to agree or object before work starts.</text>
<text x="416" y="360" class="label">REQUIRED QUESTIONS</text>

<text x="280" y="404" class="condition" text-anchor="end">Approval needed</text>
<path class="arrow" d="M 304 396 H 368"/>
<text x="416" y="404" class="question">What imposed limits apply to the work?</text>
<path class="rule" d="M 416 420 H 1200"/>

<text x="280" y="452" class="condition" text-anchor="end">Costly to undo</text>
<path class="arrow" d="M 304 444 H 368"/>
<text x="416" y="452" class="question">In what order must the work proceed?</text>
<path class="rule" d="M 416 468 H 1200"/>

<text x="416" y="496" class="detail">Uses: problem statement · risk notes.</text>
<path class="arrow" d="M 808 536 V 568"/>
<text x="808" y="592" class="detail" text-anchor="middle">Your agent checks gaps, then drafts.</text>
</svg>
