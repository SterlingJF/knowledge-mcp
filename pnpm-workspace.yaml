---
packages:
  - contracts
  - mcp-app

# One week, in minutes.
minimumReleaseAge: 10080

# Skip the esbuild install script, because esbuild's optional dependencies already ship the binary.
allowBuilds:
  esbuild: false

# Drop each override once the package that depends on it requires the fixed version.
overrides:
  # markdownlint-cli2 0.23.3 pins smol-toml 1.8.0. smol-toml 1.9.0 fixes GHSA-r4xh-jqrq-34v2.
  smol-toml: 1.9.0
  # markdownlint pulls in micromark-extension-math 3.1.0, which allows katex ^0.16.0.
  # katex 0.18.2 fixes GHSA-238p-pmpm-9mq7.
  micromark-extension-math>katex: 0.18.7
  # @modelcontextprotocol/core 2.3.1 resolves zod 4.6.5. zod 4.6.6 fixes GHSA-mrhx-c7xc-m3w5.
  zod@^4: 4.6.6
  # fast-uri 3.1.9 fixes GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr
  # and GHSA-xhq7-xmqj-769h.
  fast-uri@^3: 3.1.9
  # markdownlint resolves markdown-it 15.0.1.
  # 15.0.3 fixes GHSA-gfr2-rv44-r23c, GHSA-r7fv-28h4-cvq7 and GHSA-vfgh-jcmw-g37q.
  markdown-it@^15: 15.0.3
