---
packages:
  - contracts

# One week, in minutes.
minimumReleaseAge: 10080

# Skip the esbuild install script, because esbuild's optional dependencies already ship the binary.
allowBuilds:
  esbuild: false

# Drop each override once the package that depends on it requires the fixed version.
overrides:
  # markdownlint-cli2 0.23.3 pins smol-toml 1.8.0. smol-toml 1.9.0 fixes GHSA-r4xh-jqrq-34v2.
  smol-toml: 1.9.0
  # markdownlint pulls in micromark-extension-math 3.1.0, which allows katex ^0.16.0.
  # katex 0.18.2 fixes GHSA-238p-pmpm-9mq7.
  micromark-extension-math>katex: 0.18.7
