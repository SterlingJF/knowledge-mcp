---
# File: contracts/project/v1/vault.rest.openapi.yaml
openapi: 3.1.1
info:
  title: Vault API Components
  version: v0.1.0
  description: |
    A vault is a folder with a declared shape. It holds five content folders and
    one internal configuration folder; anything else at the root is left unread.

    The shape is fixed: `+`, `x`, `Atlas`, `Calendar`, `Efforts`,
    `.knowledge-mcp`. Creating a vault initializes them. Opening an existing
    folder creates the ones that are absent and adopts the ones already there.
    Anything else at the top level is left alone.

    Vault lifecycle only. What lives inside a vault belongs to another contract;
    this one says where it may live.
  contact:
    name: Knowledge-MCP
    url: "https://github.com/SterlingJF/knowledge-mcp/issues"

tags:
  - name: Vaults
    description: Creating, opening, listing and forgetting vaults.

paths:
  /vaults:
    x-spec-images: [desktop]
    get:
      tags:
        - Vaults
      summary: List vaults
      operationId: listVaults
      description: Every remembered vault, most recently opened first.
      responses:
        "200":
          description: The vaults.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vault"
    post:
      tags:
        - Vaults
      summary: Create a vault
      operationId: createVault
      description: |
        Creates a folder named `name` inside `parent`, initializes the six
        folders, and opens it.

        Refused if `parent` is missing, is not a directory, is not writable, or
        already holds something called `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultCreation"
      responses:
        "201":
          description: The created vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "422":
          $ref: "#/components/responses/VaultRefused"

  /vaults/open:
    x-spec-images: [desktop]
    post:
      tags:
        - Vaults
      summary: Open an existing folder as a vault
      operationId: openVault
      description: |
        Adopts `path` as a vault and opens it. Any of the six folders that are
        absent are created. Folders already there are adopted as they are.
        Nothing else in the folder is touched, moved or read.

        Refused if `path` is missing, is not a directory, or is not readable and
        writable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultSelection"
      responses:
        "200":
          description: The opened vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "422":
          $ref: "#/components/responses/VaultRefused"

  /vaults/{vaultId}:
    x-spec-images: [desktop]
    parameters:
      - $ref: "#/components/parameters/VaultIdPath"
    get:
      tags:
        - Vaults
      summary: Get a vault
      operationId: getVaultById
      responses:
        "200":
          description: The vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "404":
          description: No vault with that id.
    patch:
      tags:
        - Vaults
      summary: Rename or move a vault
      operationId: changeVault
      description: |
        Renames the folder, moves it, or both. One operation either way, and the
        id does not change.

        A move across filesystems is refused rather than performed as a copy and
        delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultChange"
      responses:
        "200":
          description: The changed vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "404":
          description: No vault with that id.
        "422":
          $ref: "#/components/responses/VaultRefused"
    delete:
      tags:
        - Vaults
      summary: Forget a vault
      operationId: forgetVault
      description: Drops the vault from the list. Nothing on disk is touched.
      responses:
        "204":
          description: Forgotten. No content.
        "404":
          description: No vault with that id.

components:
  parameters:
    VaultIdPath:
      name: vaultId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VaultId"

    XKmVault:
      name: X-Km-Vault
      in: header
      required: false
      description: |
        Which vault a request means. Absent, the process default.
      schema:
        $ref: "#/components/schemas/VaultId"

  responses:
    VaultRefused:
      description: The operation was refused. One reason at a time.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VaultRefusal"

  schemas:
    VaultId:
      type: string
      description: |
        Minted when a vault is first remembered. Never derived from the path, so
        renaming or moving a vault keeps every reference to it.
      examples:
        - "9f2a1c7d4b6e8a03"

    VaultFolderName:
      type: string
      description: The vault's declared folders. Fixed.
      enum:
        - "+"
        - "x"
        - "Atlas"
        - "Calendar"
        - "Efforts"
        - ".knowledge-mcp"

    VaultPath:
      type: string
      description: |
        A location inside a vault, relative to its root, beginning with one of
        the declared folders. A path outside them is not part of the vault.
      examples:
        - "Efforts/Knowledge Bus Protocol/decisions/some-record.md"

    VaultFolder:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/VaultFolderName"
        adopted:
          type: boolean
          description: True when the folder was already there. False when this
            vault created it.
      required:
        - name
        - adopted
      additionalProperties: false

    Vault:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/VaultId"
        name:
          type: string
          description: The folder's own basename. Never stored.
        path:
          type: string
          description: Absolute path to the vault's root.
        folders:
          type: array
          description: The six, each reporting whether it was adopted or
            created.
          items:
            $ref: "#/components/schemas/VaultFolder"
        available:
          type: boolean
          description: False when the folder has moved or been deleted. The
            vault is still listed.
        lastOpened:
          type: integer
          description: Milliseconds since the epoch.
        open:
          type: boolean
      required:
        - id
        - name
        - path
        - folders
        - available
        - lastOpened
        - open
      additionalProperties: false

    VaultCreation:
      type: object
      properties:
        parent:
          type: string
          description: Absolute path to the folder the vault is created in.
        name:
          type: string
          description: The new folder's name. No path separators.
      required:
        - parent
        - name
      additionalProperties: false

    VaultSelection:
      type: object
      properties:
        path:
          type: string
          description: Absolute path to an existing folder.
      required:
        - path
      additionalProperties: false

    VaultChange:
      type: object
      description: A rename, a move, or both. At least one.
      properties:
        name:
          type: string
        parent:
          type: string
      additionalProperties: false

    VaultRefusal:
      type: object
      properties:
        path:
          type: string
          description: What was attempted.
        reason:
          type: string
          description: Why it was refused, in words a person reads.
          examples:
            - "Something called knowledge-bus is already here"
      required:
        - path
        - reason
      additionalProperties: false
