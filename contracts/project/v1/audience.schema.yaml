---
$schema: https://json-schema.org/draft/2020-12/schema
title: kb_audience answer
description: >-
  Who a document of one type can be for, from the document type's own
  universe spec: the values of its audience frame where it declares one,
  otherwise the document type's actor with no choices.
type: object
additionalProperties: false
required:
  - schema
  - location
  - universe_spec
  - kind
  - actor
  - frame
  - choices
  - received
properties:
  schema:
    const: knowledge-mcp/audience/1
  location:
    description: The location text the host sent, as sent.
    type: string
  universe_spec:
    description: The universe spec that holds the document type.
    type: object
    additionalProperties: false
    required: [id, version, source]
    properties:
      id:
        type: string
        minLength: 1
      version:
        type: string
      source:
        description: '"sent by the host", or "bundled copy at <ref>".'
        type: string
        pattern: ^(sent by the host|bundled copy at \S+)$
  kind:
    description: The document type id the host sent.
    type: string
    minLength: 1
  actor:
    description: Who uses the document type, as kbp --kinds lists the actor.
    type: [string, "null"]
  frame:
    description: >-
      The universe spec's audience frame and its question; null when the
      universe spec declares none.
    type: [object, "null"]
    additionalProperties: false
    required: [id, question]
    properties:
      id:
        const: audience
      question:
        type: string
  choices:
    description: >-
      The audience frame's values, in the universe spec's order; empty when
      frame is null.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
        question:
          description: >-
            The value's own question, when the universe spec gives one.
          type: string
  received:
    description: >-
      Digests of the universe spec text sent in this call, to send
      instead of the text next time.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, digest]
      properties:
        name:
          type: string
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
if:
  properties:
    frame:
      type: "null"
then:
  properties:
    choices:
      const: []
