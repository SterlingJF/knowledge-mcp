---
$schema: https://json-schema.org/draft/2020-12/schema
title: kb_fit_record answer
description: >-
  The fit record merged with the file changes and fits a host sent: the
  text to save, the entries that changed, and the files waiting for the
  agent to settle their fit.
type: object
additionalProperties: false
required:
  - schema
  - location
  - based_on
  - record
  - digest
  - changed
  - to_settle
  - scopes
  - received
properties:
  schema:
    const: knowledge-mcp/fit-record-update/1
  location:
    description: The knowledge base's location text, as sent.
    type: string
  based_on:
    description: Digest of the record text the merge started from.
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  record:
    description: >-
      The merged record's text, for the host to save; null when no entry
      changed or the host sent no ground for saving.
    type: [string, "null"]
  digest:
    description: Digest of `record`, to send instead of the text next time.
    type: [string, "null"]
    pattern: ^sha256:[0-9a-f]{64}$
  note:
    description: Present when entries changed but the host sent no ground.
    type: string
  listing_changes:
    description: >-
      Present when the host sent a listing: the changes the listing showed
      against the record text sent, in the shape `changes` takes. On a merge
      again after another chat saved, the host sends these in `changes` in
      place of the listing.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [change, path]
      properties:
        change:
          enum: [created, deleted, moved, edited]
        path:
          type: string
          minLength: 1
        old_path:
          type: string
        fingerprint:
          type: string
  changed:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, change]
      properties:
        path:
          type: string
          minLength: 1
        change:
          description: >-
            "fitted" or "corrected" for a new fit, "moved" for a move (with
            `entry` when the entry moved with the file, else `was` and the
            file waits in `to_settle`), "deleted", "kept" for a correction
            kept over a fit, "fingerprint" for a new fingerprint.
          enum: [fitted, corrected, moved, deleted, kept, fingerprint]
        old_path:
          type: string
        entry:
          $ref: "#/$defs/entry"
        was:
          $ref: "#/$defs/entry"
        note:
          type: string
  to_settle:
    description: >-
      Files waiting for the agent to settle their fit, with their candidates
      as kb_fit gives the candidates.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, scope, candidates]
      properties:
        path:
          type: string
          minLength: 1
        scope:
          description: The index of the file's scope in `scopes`.
          type: integer
          minimum: 0
        candidates:
          description: Candidates in the shape fit.schema.yaml defines.
          type: array
          items:
            type: object
            required: [universe_spec, kind, matched_on]
            properties:
              universe_spec:
                type: string
              kind:
                type: string
              matched_on:
                enum: [name, folder]
        old_path:
          type: string
        was:
          $ref: "#/$defs/entry"
  scopes:
    description: >-
      The universe specs in scope at the files, once per set of
      `.knowledge-bus/` folders.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [universe_specs, every_document_type]
      properties:
        universe_specs:
          description: In the shape fit.schema.yaml defines.
          type: array
          items:
            type: object
            required: [id, version, source]
            properties:
              id:
                type: string
              version:
                type: string
              source:
                type: string
        every_document_type:
          description: >-
            As fit.schema.yaml defines it; null unless a file in this scope
            matched no document type on its name.
          type: [array, "null"]
  received:
    description: >-
      Digests of the universe spec text and record text sent in this call.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, digest]
      properties:
        name:
          type: string
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
$defs:
  entry:
    description: >-
      An entry as fit-record.schema.yaml defines it; `allowed_by` is
      absent when the host sent no ground for saving.
    type: object
    additionalProperties: false
    required: [made, time]
    properties:
      universe_spec:
        type: string
        minLength: 1
      version:
        type: string
      kind:
        type: string
        minLength: 1
      no_fit:
        const: true
      audience:
        description: >-
          The document's reader, and whether the person confirmed the
          value.
        type: object
        additionalProperties: false
        required: [value, status]
        properties:
          value:
            type: string
          status:
            enum: [confirmed, guessed]
      made:
        description: >-
          "fit" when the agent settled the fit; "correction" when the
          person stated the fit or reader. A correction wins over any
          later fit.
        enum: [fit, correction]
      allowed_by:
        description: >-
          The request, standing line or accepted change row that allowed
          the save.
        type: object
        additionalProperties: false
        required: [basis, text]
        properties:
          basis:
            enum: [request, line, change_row]
          text:
            type: string
          location:
            type: string
      fingerprint:
        description: >-
          Text the host chose that stays the same while the file's content
          does; it lets a file renamed outside the agent keep its entry.
        type: string
      time:
        description: UTC time of the save, ending in Z.
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}T.*Z$
    oneOf:
      - type: object
        required: [no_fit]
        properties:
          no_fit: true
          universe_spec: false
          version: false
          kind: false
      - type: object
        required: [universe_spec, version, kind]
        properties:
          universe_spec: true
          version: true
          kind: true
          no_fit: false
