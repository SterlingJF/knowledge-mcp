---
$schema: https://json-schema.org/draft/2020-12/schema
title: kb_fit answer
description: >-
  The kb_fit answer for one file: the universe specs in scope, the
  document types whose other names match the file name or its folder,
  and every document type in scope when none match the file name. For a
  file in the fit record whose universe spec is in scope, the answer comes
  from the record instead, in `recorded`.
type: object
additionalProperties: false
required:
  - schema
  - location
  - universe_specs
  - candidates
  - every_document_type
  - received
properties:
  schema:
    const: knowledge-mcp/fit/1
  location:
    description: The location text the host sent, as sent.
    type: string
  universe_specs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, version, source, from_parent]
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
        source:
          description: '"sent by the host", or "bundled copy at <ref>".'
          type: string
          pattern: ^(sent by the host|bundled copy at \S+)$
        from_parent:
          description: Named in the nearest workspace.yaml under from_parent.
          type: boolean
  candidates:
    description: >-
      Matches on the file name or its folder: actors matching the hat
      first when the host sent one, then matches on the file name.
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - universe_spec
        - kind
        - name
        - alias
        - action
        - actor
        - timing
        - matched
        - matched_on
      properties:
        universe_spec:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        name:
          type: string
        alias:
          description: >-
            The document type's other names, as kbp --kinds lists the names.
          type: [object, "null"]
          additionalProperties: false
          properties:
            kind:
              enum: [descriptive, normative]
            form:
              type: string
        action:
          type: [string, "null"]
        actor:
          type: [string, "null"]
        timing:
          type: [string, "null"]
        matched:
          description: The words of the file name or folder that matched.
          type: array
          minItems: 1
          items:
            type: string
        matched_on:
          description: >-
            "name" when a word of the file name matched; "folder" when only
            the folder holding the file did, a weaker match.
          enum: [name, folder]
        hat_matches:
          description: >-
            Present when the host sent a hat: whether the actor shares a
            word with the hat.
          type: boolean
  every_document_type:
    description: >-
      Every document type in scope; null when a candidate matched on the
      file name.
    type: [array, "null"]
    items:
      type: object
      additionalProperties: false
      required: [universe_spec, covers, covers_matched, kinds]
      properties:
        universe_spec:
          type: string
          minLength: 1
        covers:
          type: [string, "null"]
        covers_matched:
          type: array
          items:
            type: string
        kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, action, actor]
            properties:
              kind:
                type: string
                minLength: 1
              action:
                type: [string, "null"]
              actor:
                type: [string, "null"]
  recorded:
    description: >-
      The file's entry in the fit record, as fit-record.schema.yaml defines
      an entry, with its path and the label "from the record". Present only
      when the host sent the record and the record holds the file; the
      candidates are then empty.
    type: object
    additionalProperties: false
    required: [path, label, made, allowed_by, time]
    properties:
      path:
        type: string
        minLength: 1
      label:
        const: from the record
      universe_spec:
        type: string
        minLength: 1
      version:
        type: string
      kind:
        type: string
        minLength: 1
      no_fit:
        const: true
      audience:
        type: object
        additionalProperties: false
        required: [value, status]
        properties:
          value:
            type: string
          status:
            enum: [confirmed, guessed]
      made:
        enum: [fit, correction]
      allowed_by:
        type: object
        additionalProperties: false
        required: [basis, text]
        properties:
          basis:
            enum: [request, line, change_row]
          text:
            type: string
          location:
            type: string
      fingerprint:
        type: string
      time:
        type: string
  received:
    description: >-
      Digests of the universe spec text and the record text sent in this
      call, to send instead of the text next time.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, digest]
      properties:
        name:
          type: string
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
