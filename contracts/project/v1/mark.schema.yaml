---
$schema: https://json-schema.org/draft/2020-12/schema
title: kb_mark answer
description: >-
  The kb_mark answer for one outside document: for every universe spec in
  scope, each document type and the questions of the elements the
  document type keeps, as kbp --card prints them; and the passages the
  document's text splits into, by line. The agent marks each passage
  against these questions.
type: object
additionalProperties: false
required:
  - schema
  - location
  - universe_specs
  - passages
  - received
properties:
  schema:
    const: knowledge-mcp/mark/1
  location:
    description: The location text the host sent, as sent.
    type: string
  universe_specs:
    description: >-
      The universe specs in scope, in the order kbp --kinds lists them.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, version, source, from_parent, document_types]
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
        source:
          description: '"sent by the host", or "bundled copy at <ref>".'
          type: string
          pattern: ^(sent by the host|bundled copy at \S+)$
        from_parent:
          description: Named in the nearest workspace.yaml under from_parent.
          type: boolean
        document_types:
          description: Every document type of the universe spec, in kbp's order.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, name, action, actor, elements]
            properties:
              kind:
                type: string
                minLength: 1
              name:
                type: string
              action:
                description: >-
                  What the document lets its reader do, from kbp --kinds.
                type: [string, "null"]
              actor:
                description: Who uses the document type, from kbp --kinds.
                type: [string, "null"]
              elements:
                description: >-
                  The card's sections the document type keeps, in the card's
                  order. A section the card links to another document type
                  appears under that document type.
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [element, question, strength]
                  properties:
                    element:
                      type: string
                      minLength: 1
                    question:
                      type: string
                      minLength: 1
                    strength:
                      description: >-
                        The section's strength on the card, such as core.
                      type: string
  passages:
    description: >-
      The document's text split into headings, paragraphs, list items and
      code blocks, in order. A text holding no passage gets a refusal.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, kind, lines, opening, under]
      properties:
        id:
          description: p1 for the first passage, p2 for the next.
          type: string
          pattern: ^p[1-9][0-9]*$
        kind:
          enum: [heading, paragraph, list-item, code]
        lines:
          description: The first and last line of the passage, counting from 1.
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
        opening:
          description: The passage's first words, ending in … when cut.
          type: string
          minLength: 1
        under:
          description: The id of the heading the passage sits under, or null.
          type: [string, "null"]
          pattern: ^p[1-9][0-9]*$
  received:
    description: >-
      Digests of the universe spec text sent in this call, to send
      instead of the text next time.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, digest]
      properties:
        name:
          type: string
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
