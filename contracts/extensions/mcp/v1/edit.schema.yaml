---
$schema: https://json-schema.org/draft/2020-12/schema
$id: edit.schema.yaml
title: kb_record_edit result
description:
  The structuredContent of a kb_record_edit result, or problem details
  when isError is true.
type: object
oneOf:
  - $ref: "#/$defs/answer"
  - $ref: problem.schema.yaml
$defs:
  edit_changes:
    title: Edit changes
    description:
      The changed lines of an edit in document order, capped at 12 lines.
      Absent when the edit sent `after_digest` without `after`.
    type: object
    additionalProperties: false
    required:
      - hunks
      - lines
      - more
    properties:
      hunks:
        description: The number of separate changed blocks.
        type: integer
        minimum: 0
      lines:
        type: array
        maxItems: 12
        items:
          $ref: "#/$defs/changed_line"
      more:
        description: The number of changed lines beyond the cap.
        type: integer
        minimum: 0
  changed_line:
    title: Changed line
    type: object
    additionalProperties: false
    required:
      - change
      - text
    properties:
      change:
        enum:
          - removed
          - added
      text:
        description: The line without its line ending.
        type: string
  answer:
    title: Edit receipt
    description:
      The recorded edit without `before` and `after`, which the agent already
      has. `changes` carries a capped excerpt of the changed lines instead.
    type: object
    additionalProperties: false
    required:
      - schema
      - id
      - time
      - location
      - allowed_by
      - before_digest
      - after_digest
      - card
    properties:
      schema:
        const: knowledge-mcp/edit/2
      id:
        $ref: common.schema.yaml#/$defs/edit_id
      time:
        $ref: common.schema.yaml#/$defs/time
      location:
        $ref: common.schema.yaml#/$defs/location
      allowed_by:
        $ref: document-types.schema.yaml#/$defs/allowed_by
      whole_file:
        description: Present when the edit replaced the whole file.
        const: true
      before_digest:
        $ref: common.schema.yaml#/$defs/digest
      after_digest:
        $ref: common.schema.yaml#/$defs/digest
      operation:
        $ref: common.schema.yaml#/$defs/edit_operation
      created:
        description: Present when the edit created the file, that is when `before` was empty.
        const: true
      undoes:
        title: Undone edit
        description: The earlier edit this edit undoes, named by the `undoes` argument.
        type: object
        additionalProperties: false
        required:
          - id
          - time
        properties:
          id:
            $ref: common.schema.yaml#/$defs/edit_id
          time:
            $ref: common.schema.yaml#/$defs/time
      changes:
        $ref: "#/$defs/edit_changes"
      card:
        description: The saved edit as markdown. Show it in your reply unchanged.
        type: string
        minLength: 1
    if:
      type: object
      required:
        - operation
      properties:
        operation: true
    then:
      type: object
      required:
        - whole_file
      properties:
        whole_file:
          const: true
