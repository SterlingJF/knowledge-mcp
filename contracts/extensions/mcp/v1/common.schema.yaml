---
$schema: https://json-schema.org/draft/2020-12/schema
$id: common.schema.yaml
title: Shared shapes
description: Definitions shared by the tool results and the document-types file.
$defs:
  location:
    title: Location
    type: string
  path:
    title: Path
    description: >-
      Path from the knowledge base's root folder, with `/` between folders,
      such as `docs/rfcs/0042-cache.md`.
    type: string
    minLength: 1
  fingerprint:
    title: Fingerprint
    description: >-
      A value that changes only when the file content changes, such as SHA-256
      or Drive's `md5Checksum`.
      kb_prepare_document_types uses fingerprints to find files in `listing`
      that moved.
    type: string
  digest:
    title: Digest
    description: The SHA-256 of the text's UTF-8 bytes.
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  time:
    title: Time
    description: ISO 8601 date and time in UTC.
    type: string
    pattern: ^\d{4}-\d{2}-\d{2}T.*Z$
  edit_id:
    title: Edit id
    type: string
    pattern: ^[0-9a-f]{32}$
  received:
    title: Received
    description: >-
      Digests of the texts sent in this call. Later in the session, send a
      digest in place of its text.
    type: array
    items:
      title: Received text
      type: object
      additionalProperties: false
      required: [name, digest]
      properties:
        name:
          type: string
        digest:
          $ref: "#/$defs/digest"
  spec:
    title: Spec in scope
    type: object
    additionalProperties: false
    required: [id, version, source, from_parent]
    properties:
      id:
        type: string
        minLength: 1
      version:
        type: string
      source:
        description: >-
          `bundled copy at <ref>` means knowledge-mcp used its own copy of the
          universe spec, taken from git ref `<ref>` of the knowledge-bus
          repository.
        type: string
        pattern: ^(sent by the harness|bundled copy at \S+)$
      from_parent:
        description: >-
          True when the universe spec comes from a `.knowledge-bus/` folder
          above the deepest `.knowledge-bus/` folder the harness sent.
        type: boolean
  candidate:
    title: Candidate
    description: >-
      A document type whose alias shares a word with the file name or its
      nearest folder.
    type: object
    additionalProperties: false
    required:
      - universe_spec
      - document_type
      - name
      - alias
      - action
      - actor
      - timing
      - matched
      - matched_on
    properties:
      universe_spec:
        type: string
        minLength: 1
      document_type:
        type: string
        minLength: 1
      name:
        type: string
      alias:
        title: Alias
        description: From kbp_kinds.
        type: [object, "null"]
        additionalProperties: false
        properties:
          kind:
            enum: [descriptive, normative]
          form:
            type: string
      action:
        type: [string, "null"]
      actor:
        type: [string, "null"]
      timing:
        type: [string, "null"]
      matched:
        description: >-
          Words shared by the alias and the file name or nearest folder,
          lowercased with common plural suffixes removed.
        type: array
        minItems: 1
        items:
          type: string
      matched_on:
        description: "`folder` means only the nearest folder name matched."
        enum: [name, folder]
      role_matches:
        description: >-
          True when `actor` and the role share a normalized word after knowledge-mcp
          removes stopwords. Present only when the harness sent a role.
        type: boolean
  type_group:
    title: Type group
    type: object
    additionalProperties: false
    required: [universe_spec, covers, covers_matched, kinds]
    properties:
      universe_spec:
        type: string
        minLength: 1
      covers:
        type: [string, "null"]
      covers_matched:
        description: >-
          Words in the path that also appear in the universe spec label or
          `covers`.
        type: array
        items:
          type: string
      kinds:
        type: array
        items:
          title: Listed document type
          type: object
          additionalProperties: false
          required: [document_type, action, actor]
          properties:
            document_type:
              type: string
              minLength: 1
            action:
              type: [string, "null"]
            actor:
              type: [string, "null"]
  file_change:
    title: File change
    oneOf:
      - $ref: "#/$defs/created"
      - $ref: "#/$defs/deleted"
      - $ref: "#/$defs/moved"
      - $ref: "#/$defs/edited"
  created:
    title: File created
    type: object
    additionalProperties: false
    required: [change, path]
    properties:
      change:
        const: created
      path:
        $ref: "#/$defs/path"
      fingerprint:
        $ref: "#/$defs/fingerprint"
  deleted:
    title: File deleted
    type: object
    additionalProperties: false
    required: [change, path]
    properties:
      change:
        const: deleted
      path:
        $ref: "#/$defs/path"
  moved:
    title: File moved
    type: object
    additionalProperties: false
    required: [change, path, old_path]
    properties:
      change:
        const: moved
      path:
        description: The path after the move.
        $ref: "#/$defs/path"
      old_path:
        $ref: "#/$defs/path"
      fingerprint:
        $ref: "#/$defs/fingerprint"
  edited:
    title: File edited
    type: object
    additionalProperties: false
    required: [change, path, fingerprint]
    properties:
      change:
        const: edited
      path:
        $ref: "#/$defs/path"
      fingerprint:
        $ref: "#/$defs/fingerprint"
