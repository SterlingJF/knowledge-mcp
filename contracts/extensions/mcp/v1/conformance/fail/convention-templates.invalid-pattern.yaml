---
schema: knowledge-mcp/convention-templates/1
location: vault
templates:
  - id: ace
    title: ACE
    sources:
      - title: ACE folder framework
        url: https://blog.linkingyourthinking.com/notes/ace-folder-framework
      - title: ACE expands and contracts
        url: https://blog.linkingyourthinking.com/notes/the-ace-folder-framework-flexes-for-you
      - title: Detailed ACE structure
        url: https://blog.linkingyourthinking.com/notes/a-deeper-dive-into-how-ace-works
      - title: Daily notes
        url: https://obsidian.md/help/plugins/daily-notes
    variants:
      - id: atlas-title
        folder_role: Atlas
        purpose: Knowledge, ideas, reference, maps, people and sources.
        folder:
          - Atlas
        name:
          separator: " "
          case: as-written
          parts:
            - part: unrecorded
        content:
          label: document title
          instruction: Read the document title.
        folder_sources:
          - https://blog.linkingyourthinking.com/notes/ace-folder-framework
        name_sources: []
        adaptation:
          knowledge-mcp suggests title naming. Keep supplied folder names and
          confirm each customized assignment.
      - id: calendar-daily
        folder_role: Calendar
        purpose: Notes for a recorded calendar date.
        folder:
          - Calendar
        name:
          separator: " "
          case: as-written
          parts:
            - part: date
              property: date
              format: YYYY-MM-DD
        folder_sources:
          - https://blog.linkingyourthinking.com/notes/ace-folder-framework
        name_sources:
          - https://obsidian.md/help/plugins/daily-notes
        adaptation:
          Use the date property accepted for this document type. Ask for the
          actual Calendar folder when customizing ACE.
      - id: calendar-note
        folder_role: Calendar
        purpose: Meetings and other dated notes.
        folder:
          - Calendar
        name:
          separator: " "
          case: as-written
          parts:
            - part: date
              property: date
              format: YYYY-MM-DD
            - part: content
        content:
          label: document title
          instruction: Read the document title.
        folder_sources:
          - https://blog.linkingyourthinking.com/notes/ace-folder-framework
        name_sources: []
        adaptation:
          knowledge-mcp suggests date and title naming. Confirm the recorded
          date property and the actual Calendar folder.
      - id: efforts-title
        folder_role: Efforts
        purpose: Project and action notes.
        folder:
          - Efforts
        name:
          separator: " "
          case: as-written
          parts:
            - part: content
        content:
          label: document title
          instruction: Read the document title.
        folder_sources:
          - https://blog.linkingyourthinking.com/notes/ace-folder-framework
        name_sources: []
        adaptation:
          knowledge-mcp suggests title naming. Keep supplied folder names and
          confirm each customized assignment.
