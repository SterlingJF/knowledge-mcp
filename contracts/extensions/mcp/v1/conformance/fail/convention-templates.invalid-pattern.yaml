          - https://johnnydecimal.com/documentation/saving-files
        name_sources:
          - https://johnnydecimal.com/documentation/naming-files
        adaptation:
          Ask for existing or person-supplied area, category and ID folders.
          Validate category membership within the area and ID membership within the category.
          Preserve supplied numbers and titles. Confirm the recorded date property.
