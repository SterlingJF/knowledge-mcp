      - title: IDs
        url: https://johnnydecimal.com/documentation/ids
      - title: Saving files
        url: https://johnnydecimal.com/documentation/saving-files
      - title: Naming files
        url: https://johnnydecimal.com/documentation/naming-files
    variants:
      - id: id-date-title
        folder_role: ID folder
        purpose: Notes directly inside a supplied numbered ID folder.
        folder: null
        name:
          separator: " "
          case: as-written
          parts:
            - part: date
              property: date
              format: YYYY-MM-DD
            - part: content
        content:
