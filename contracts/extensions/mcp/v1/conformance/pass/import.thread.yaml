---
schema: knowledge-mcp/import/1
location: pasted in chat
universe_specs:
  - id: codebase-recordkeeping
    version: "0.1"
    source: bundled copy at v0.10.0
    from_parent: false
  - id: product-development
    version: "0.9"
    source: bundled copy at v0.10.0
    from_parent: false
document_types:
  - universe_spec: codebase-recordkeeping
    document_type: readme
    name: Readme
    action: decide whether to try the project or one of its packages
    actor: a first-time visitor
    elements:
      - element: project-purpose
        question: What does the project do?
        strength: core
      - element: install-steps
        question: Which steps install the software?
        strength: situational
      - element: first-result
        question: How does a new user get a first working result?
        strength: situational
      - element: excluded-uses
        question: Which uses of the software do the maintainers exclude?
        strength: situational
      - element: project-status
        question:
          Which status does the project or package have, such as active or no
          longer maintained?
        strength: situational
      - element: help-channel
        question: Where does a user or contributor get help?
        strength: situational
      - element: docs-location
        question: Where is the full documentation?
        strength: situational
      - element: maintainers
        question: Who maintains the project or package?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: license-file
    name: License file
    action: decide whether the licence allows the planned use of the code
    actor: anyone who plans to use, copy or change the code
    elements:
      - element: license-id
        question: Which main licence applies to the code?
        strength: core
      - element: copyright-holder
        question: Who holds the copyright in the code?
        strength: situational
      - element: part-licences
        question: Which licence applies to each part of the code outside the main licence?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: release-notes
    name: Release notes
    action: decide whether to upgrade to a new release
    actor: a user
    elements:
      - element: release-version
        question: Which version do the release notes describe?
        strength: core
      - element: breaking-change
        question: Which existing uses of the software stop working?
        strength: core
      - element: release-date
        question: On which date did the maintainers publish the release?
        strength: situational
      - element: deprecations
        question: Which features will a later release remove?
        strength: situational
      - element: upgrade-steps
        question: Which steps must a user take to upgrade?
        strength: situational
      - element: security-fixes
        question: Which vulnerabilities does the release fix?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: security-policy
    name: Security policy
    action: report a vulnerability privately to the maintainers
    actor: a person who finds a vulnerability in the software
    elements:
      - element: report-channel
        question: How does someone report a vulnerability privately?
        strength: core
      - element: report-contents
        question: Which facts must a vulnerability report include?
        strength: situational
      - element: supported-versions
        question: Which versions get security fixes?
        strength: situational
      - element: first-reply-days
        question: How many days does a reporter wait for a first reply?
        strength: situational
      - element: disclosure-timing
        question: When do the maintainers publish details of a fixed vulnerability?
        strength: situational
      - element: vulnerability-scope
        question: Which findings count as vulnerabilities?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: contributing-guide
    name: Contributing guide
    action: prepare a change the maintainers will accept
    actor: a contributor
    elements:
      - element: contribution-route
        question: Where does a contributor propose a change first?
        strength: core
      - element: change-refusal
        question: Which changes will the maintainers refuse?
        strength: situational
      - element: required-evidence
        question: Which evidence must a change include?
        strength: situational
      - element: code-style
        question: Which style rules must the code follow?
        strength: situational
      - element: commit-format
        question: Which format must commit messages follow?
        strength: situational
      - element: ai-use-rules
        question: Which uses of AI tools do the maintainers accept in a change?
        strength: situational
      - element: ai-duties
        question: Which duties does a contributor have for AI-assisted work?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: commit-message
    name: Commit message
    action: decide whether to keep or undo a past change
    actor: a maintainer or contributor
    elements:
      - element: change-summary
        question: What does the change do?
        strength: core
      - element: change-reason
        question: Which problem does the change solve?
        strength: core
      - element: change-kind
        question: Which kind is the change, such as a bug fix or a new feature?
        strength: situational
      - element: related-changes
        question: Which earlier issues or changes does the change refer to?
        strength: situational
      - element: sign-off
        question:
          Who certifies having the right to submit the change under the project's
          licence?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: code-of-conduct
    name: Code of conduct
    action: report unacceptable behaviour by someone taking part in the project
    actor: anyone who takes part in the project
    elements:
      - element: unacceptable-behaviour
        question: Which behaviour is unacceptable?
        strength: core
      - element: conduct-report
        question: Where does someone report unacceptable behaviour?
        strength: core
      - element: conduct-consequences
        question: Which consequences follow unacceptable behaviour?
        strength: situational
      - element: conduct-scope
        question:
          Which spaces does the code of conduct apply to, such as forums, events
          or chats?
        strength: situational
      - element: conduct-enforcers
        question: Who enforces the code of conduct?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: agent-instructions
    name: Agent instructions
    action: follow the project's rules for building, testing and changing the code
    actor: a coding agent
    elements:
      - element: generated-files
        question: Which files does a tool generate?
        strength: situational
      - element: commit-checks
        question: Which checks must pass before a commit?
        strength: situational
      - element: approval-needed
        question: Which actions need approval from a person first?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: change-description
    name: Change description
    action: decide whether to merge a change
    actor: a maintainer
    elements:
      - element: verification
        question: How did the contributor check the change?
        strength: situational
      - element: unchanged-behaviour
        question: Which behaviour stays the same after the change?
        strength: situational
      - element: release-note-line
        question: Which entry in the release notes describes each change?
        strength: situational
      - element: ai-use-record
        question: Which AI tools did the contributor use for the change?
        strength: situational
      - element: known-shortcomings
        question: Which known shortcomings does the change have?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: design-proposal
    name: Design proposal
    action: accept or reject a proposed design
    actor: the maintainers who decide on designs
    elements:
      - element: proposal-motivation
        question: Which problem does the proposal address?
        strength: core
      - element: proposed-design
        question: Which design does the proposal recommend?
        strength: core
      - element: design-goals
        question: Which results must the design achieve?
        strength: situational
      - element: design-non-goals
        question: Which results do the authors leave out of the design on purpose?
        strength: situational
      - element: design-alternatives
        question: Which other designs did the authors consider?
        strength: situational
      - element: undecided-parts
        question: Which parts of the design are still undecided?
        strength: situational
      - element: proposal-status
        question: Which status does the proposal have?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: release-procedure
    name: Release procedure
    action: publish a release by following the project's steps
    actor: the maintainer who publishes the release
    elements:
      - element: release-steps
        question: Which steps does a maintainer follow to publish a release?
        strength: core
      - element: release-owner
        question: Who publishes the next release?
        strength: situational
      - element: release-schedule
        question: When is the next release due?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: architecture-overview
    name: Architecture overview
    action: learn how the main parts of the code work together
    actor: a contributor or security reviewer
    elements:
      - element: components
        question: What does each main part of the code do?
        strength: core
      - element: part-interactions
        question: How do the main parts of the code interact?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: notice-file
    name: Notice file
    action:
      include the required attribution notices in a redistributed copy of the
      software
    actor: anyone who redistributes the software, on its own or inside another work
    elements:
      - element: attribution-notices
        question: Which attribution notices must every redistributed copy include?
        strength: core
      - element: bundled-licences
        question:
          Which licence applies to each component from another project that the
          software includes?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: folder-readme
    name: Folder readme
    action: find the files to read or change in a folder
    actor: a contributor or maintainer
    elements:
      - element: folder-purpose
        question: What does each folder hold?
        strength: core
  - universe_spec: codebase-recordkeeping
    document_type: issue-report
    name: Issue report
    action: decide whether to fix a reported bug or build a requested feature
    actor: a maintainer
    elements:
      - element: observed-behaviour
        question: Which behaviour did the reporter observe?
        strength: core
      - element: repro-steps
        question: Which steps reproduce the bug?
        strength: core
      - element: reporter-environment
        question:
          Which setup does the reporter use, such as the software version and
          the platform?
        strength: core
      - element: requested-behaviour
        question: What should the requested feature do?
        strength: core
      - element: expected-behaviour
        question: Which behaviour did the reporter expect?
        strength: situational
      - element: duplicate-search
        question: Which existing issues did the reporter check?
        strength: situational
      - element: feature-need
        question: Which problem would the requested feature solve?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: code-owners
    name: Code owners
    action: find who must approve a change to each file or folder
    actor: a contributor
    elements:
      - element: path-approvers
        question: Which people or teams must approve a change to each file or folder?
        strength: core
  - universe_spec: codebase-recordkeeping
    document_type: documentation-set
    name: Documentation set
    action: complete a task with the software, such as installing it or fixing an error
    actor: a user
    elements:
      - element: settings-reference
        question: Which settings does the software accept?
        strength: core
      - element: error-fixes
        question: How does a user fix a known error?
        strength: core
      - element: docs-version
        question: Which release of the software does each documentation page describe?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: funding-file
    name: Funding file
    action: give money to the project's maintainers
    actor: a sponsor
    elements:
      - element: funding-links
        question: Where can a sponsor give money to the maintainers?
        strength: core
      - element: sponsored-accounts
        question: Which people or organisations does a sponsor pay?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: roadmap
    name: Roadmap
    action: choose which planned work to wait for or help build
    actor: a user or contributor
    elements:
      - element: planned-work
        question: Which work do the maintainers plan next?
        strength: core
      - element: help-wanted
        question: Which planned work do the maintainers ask contributors to help with?
        strength: situational
      - element: declined-ideas
        question: Which ideas have the maintainers declined?
        strength: situational
      - element: roadmap-date
        question: When did the maintainers last update the plan for upcoming work?
        strength: situational
  - universe_spec: codebase-recordkeeping
    document_type: development-guide
    name: Development guide
    action: build, run and test the code from a local copy of the repository
    actor: a contributor
    elements:
      - element: dev-setup
        question: How does a contributor set up a local copy for development?
        strength: core
      - element: build-command
        question: Which commands build the software?
        strength: core
      - element: test-command
        question: Which commands run the tests?
        strength: core
  - universe_spec: product-development
    document_type: product-strategy-canvas
    name: Product strategy canvas
    action: choose what an offering will aim for next and what it will refuse
    actor: whoever leads the offering
    elements:
      - element: product-vision
        question: What lasting change should the work make?
        strength: core
      - element: customer-segments
        question: Exactly which groups is the offering for?
        strength: core
      - element: value-proposition
        question: Why would a segment choose the offering over its alternatives?
        strength: core
      - element: cost-structure
        question: What mainly determines the cost of providing the offering?
        strength: core
      - element: trade-offs
        question: Which promising directions do we refuse?
        strength: core
      - element: capabilities
        question: Which abilities must we have or gain?
        strength: core
      - element: growth-mechanism
        question: How does the offering's growth produce more growth?
        strength: core
      - element: unfair-advantage
        question: What advantage of ours is hard for others to copy or buy?
        strength: core
      - element: positioning-statement
        question: Which kind of offering should each segment see ours as?
        strength: situational
      - element: input-metrics
        question:
          Which measures within our control predict the value people get from
          the offering?
        strength: situational
      - element: revenue-streams
        question: How does the offering earn money?
        strength: situational
      - element: case-for-change
        question: Why is the work worth doing now?
        strength: situational
  - universe_spec: product-development
    document_type: business-model-canvas
    name: Business model canvas
    action:
      check whether a business can deliver an offering its customers value and
      earn more than providing it costs
    actor: whoever starts, runs or funds the business
    elements:
      - element: customer-segments
        question: Exactly which groups is the offering for?
        strength: core
      - element: value-proposition
        question: Why would a segment choose the offering over its alternatives?
        strength: core
      - element: channels
        question: How does the offering reach each segment?
        strength: core
      - element: customer-relationships
        question: What kind of relationship do we keep with each segment?
        strength: core
      - element: revenue-streams
        question: How does the offering earn money?
        strength: core
      - element: key-resources
        question: What assets must we own or control?
        strength: core
      - element: key-activities
        question: Which activities must we perform ourselves?
        strength: core
      - element: key-partnerships
        question: What do we deliberately rely on others for?
        strength: core
      - element: cost-structure
        question: What mainly determines the cost of providing the offering?
        strength: core
  - universe_spec: product-development
    document_type: lean-canvas
    name: Lean canvas
    action: choose which assumption in a new venture's business model to test next
    actor: whoever is starting the venture
    elements:
      - element: problem-statement
        question: What problem should the work solve?
        strength: core
      - element: customer-segments
        question: Exactly which groups is the offering for?
        strength: core
      - element: value-proposition
        question: Why would a segment choose the offering over its alternatives?
        strength: core
      - element: solution-overview
        question: What is the intended solution, in outline?
        strength: core
      - element: channels
        question: How does the offering reach each segment?
        strength: core
      - element: revenue-streams
        question: How does the offering earn money?
        strength: core
      - element: cost-structure
        question: What mainly determines the cost of providing the offering?
        strength: core
      - element: input-metrics
        question:
          Which measures within our control predict the value people get from
          the offering?
        strength: core
      - element: unfair-advantage
        question: What advantage of ours is hard for others to copy or buy?
        strength: core
  - universe_spec: product-development
    document_type: startup-canvas
    name: Startup canvas
    action: decide what a new venture will aim for and how it will make money
    actor: whoever is founding the venture, with any backers
    elements:
      - element: product-vision
        question: What lasting change should the work make?
        strength: core
      - element: customer-segments
        question: Exactly which groups is the offering for?
        strength: core
      - element: value-proposition
        question: Why would a segment choose the offering over its alternatives?
        strength: core
      - element: cost-structure
        question: What mainly determines the cost of providing the offering?
        strength: core
      - element: trade-offs
        question: Which promising directions do we refuse?
        strength: core
      - element: capabilities
        question: Which abilities must we have or gain?
        strength: core
      - element: revenue-streams
        question: How does the offering earn money?
        strength: core
      - element: positioning-statement
        question: Which kind of offering should each segment see ours as?
        strength: situational
      - element: input-metrics
        question:
          Which measures within our control predict the value people get from
          the offering?
        strength: situational
      - element: growth-mechanism
        question: How does the offering's growth produce more growth?
        strength: situational
      - element: unfair-advantage
        question: What advantage of ours is hard for others to copy or buy?
        strength: situational
  - universe_spec: product-development
    document_type: swot-analysis
    name: Swot analysis
    action:
      compare our strengths and weaknesses with the opportunities and threats
      outside us
    actor: whoever sets the plan
    elements:
      - element: internal-strengths-weaknesses
        question: Which of our own strengths and weaknesses matter to the work?
        strength: core
      - element: external-opportunities-threats
        question: Which outside opportunities and threats matter to the work?
        strength: core
  - universe_spec: product-development
    document_type: pestle-analysis
    name: Pestle analysis
    action:
      check which political, economic, social, technological, legal and environmental
      conditions affect the work
    actor: whoever sets the plan
    elements:
      - element: macro-environment-factors
        question:
          Which political, economic, social, technological, legal or environmental
          conditions affect the work?
        strength: core
  - universe_spec: product-development
    document_type: competitor-analysis
    name: Competitor analysis
    action:
      find where the offering can differ from the other options people have, including
      doing nothing
    actor: whoever decides what to offer or how to present it
    elements:
      - element: competitor-profile
        question: How well does each alternative serve the people the offering is for?
        strength: core
      - element: positioning-statement
        question: Which kind of offering should each segment see ours as?
        strength: situational
  - universe_spec: product-development
    document_type: persona-profile
    name: Persona profile
    action:
      decide which kind of person, in which circumstance, to design the solution
      for
    actor: whoever designs the solution or studies the people it is for
    elements:
      - element: jobs-to-be-done
        question: What is a person trying to achieve?
        strength: core
      - element: pains-and-gains
        question: What frustrations and hoped-for gains does each segment have?
        strength: core
      - element: customer-segments
        question: Exactly which groups is the offering for?
        strength: core
      - element: user-job-stories
        question: What should the solution let a person do?
        strength: situational
      - element: channels
        question: How does the offering reach each segment?
        strength: situational
  - universe_spec: product-development
    document_type: opportunity-assessment
    name: Opportunity assessment
    action: decide whether to pursue a problem at all
    actor: whoever would fund or approve the work
    elements:
      - element: problem-statement
        question: What problem should the work solve?
        strength: core
      - element: case-for-change
        question: Why is the work worth doing now?
        strength: core
      - element: risks-and-assumptions
        question: What could harm the work if it happened or proved wrong?
        strength: core
      - element: consent-and-authority
        question: What licence, permit, consent or legal basis allows the work?
        strength: core
      - element: customer-segments
        question: Exactly which groups is the offering for?
        strength: situational
      - element: market-sizing
        question: How large is the market the offering could serve?
        strength: situational
      - element: value-proposition
        question: Why would a segment choose the offering over its alternatives?
        strength: situational
      - element: competitor-profile
        question: How well does each alternative serve the people the offering is for?
        strength: situational
      - element: success-criteria
        question: What observable result counts as success for the work?
        strength: situational
      - element: affected-and-interested-parties
        question: Who does the work affect beyond those accountable for it?
        strength: situational
      - element: decision-authority-and-approvals
        question: Whose approval does the work need?
        strength: situational
      - element: funding-source
        question: Who funds the work?
        strength: situational
  - universe_spec: product-development
    document_type: risk-assessment
    name: Risk assessment
    action: decide which risks to reduce, accept or watch, and who handles each
    actor: the person accountable for the work
    elements:
      - element: risks-and-assumptions
        question: What could harm the work if it happened or proved wrong?
        strength: core
      - element: affected-and-interested-parties
        question: Who does the work affect beyond those accountable for it?
        strength: core
      - element: open-questions
        question: Which questions about the work remain open?
        strength: situational
  - universe_spec: product-development
    document_type: design-doc
    name: Design doc
    action: agree to or object to one proposed approach
    actor: reviewer
    elements:
      - element: goals-and-non-goals
        question: Which goals does the work pursue?
        strength: core
      - element: solution-overview
        question: What is the intended solution, in outline?
        strength: core
      - element: alternatives-considered
        question: Which options do we consider?
        strength: core
      - element: open-questions
        question: Which questions about the work remain open?
        strength: core
      - element: constraints
        question: What imposed limits apply to the work?
        strength: core
      - element: cross-cutting-concerns
        question: Which requirements must every part of the solution meet?
        strength: core
      - element: sequence-and-foreclosure
        question: In what order must the work proceed?
        strength: core
      - element: rollout-and-phasing
        question: In what stages do we introduce the solution?
        strength: situational
      - element: prior-art
        question: How have others solved problems like ours?
        strength: situational
      - element: scope-in-out
        question: What do we include in the solution now, defer, or exclude?
        strength: situational
      - element: user-job-stories
        question: What should the solution let a person do?
        strength: situational
      - element: as-built-survey
        question: What do measurements of the existing state show?
        strength: situational
  - universe_spec: product-development
    document_type: brand-identity-guide
    name: Brand identity guide
    action: apply the brand's look and wording correctly on your own
    actor: anyone writing or designing for the brand
    elements:
      - element: brand-character
        question: What feeling should the brand's look and wording create?
        strength: core
      - element: visual-identity-rules
        question: What are the rules for the brand's look?
        strength: core
      - element: verbal-identity-rules
        question: What are the rules for the brand's wording?
        strength: core
      - element: constraints
        question: What imposed limits apply to the work?
        strength: situational
      - element: open-questions
        question: Which questions about the work remain open?
        strength: situational
  - universe_spec: product-development
    document_type: scenario-walkthrough
    name: Scenario walkthrough
    action: check, step by step, that one person can reach one goal through the solution
    actor: reviewer
    elements:
      - element: stepwise-trace
        question: What happens at each step of one path through the solution?
        strength: core
      - element: user-job-stories
        question: What should the solution let a person do?
        strength: core
  - universe_spec: product-development
    document_type: success-metrics
    name: Success metrics
    action: decide which numbers to improve next and which to keep where they are
    actor: whoever runs the offering day to day
    elements:
      - element: north-star-metric
        question: What one measure best shows the value people get from the offering?
        strength: core
      - element: input-metrics
        question:
          Which measures within our control predict the value people get from
          the offering?
        strength: core
      - element: guardrail-health-metrics
        question: Which measures must stay within set ranges while we pursue other targets?
        strength: core
      - element: success-criteria
        question: What observable result counts as success for the work?
        strength: situational
  - universe_spec: product-development
    document_type: architecture-overview
    name: Architecture overview
    action: find which parts of the system a change will affect
    actor: whoever will change the system
    elements:
      - element: components-and-responsibilities
        question: What is each part of the system responsible for?
        strength: core
      - element: data-flows-and-integrations
        question: What data moves where?
        strength: core
      - element: canonical-model
        question: Which named categories does the system use?
        strength: situational
      - element: as-built-survey
        question: What do measurements of the existing state show?
        strength: situational
  - universe_spec: product-development
    document_type: system-context-diagram
    name: System context diagram
    action:
      find what the system is responsible for and which outside people and systems
      it works with
    actor: anyone new to the system
    elements:
      - element: system-boundary-and-context
        question: What is the system itself responsible for?
        strength: core
      - element: data-flows-and-integrations
        question: What data moves where?
        strength: core
  - universe_spec: product-development
    document_type: decision-brief
    name: Decision brief
    action: choose one of several options by a set date
    actor: the person accountable for the choice
    elements:
      - element: alternatives-considered
        question: Which options do we consider?
        strength: core
      - element: decision-criteria
        question: By what criteria do we judge the options?
        strength: core
      - element: decision-authority-and-approvals
        question: Whose approval does the work need?
        strength: core
      - element: constraints
        question: What imposed limits apply to the work?
        strength: situational
      - element: prior-art
        question: How have others solved problems like ours?
        strength: situational
      - element: open-questions
