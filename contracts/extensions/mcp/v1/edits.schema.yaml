---
$schema: https://json-schema.org/draft/2020-12/schema
$id: edits.schema.yaml
title: kb_list_edits result
description: >-
  The structuredContent of a kb_list_edits result, or problem details when
  isError is true.
type: object
oneOf:
  - $ref: "#/$defs/answer"
  - $ref: problem.schema.yaml
$defs:
  answer:
    title: Edits answer
    description: Edits recorded for `location`, oldest first.
    type: object
    additionalProperties: false
    required: [schema, location, edits]
    properties:
      schema:
        const: knowledge-mcp/edits/1
      location:
        $ref: common.schema.yaml#/$defs/location
      edits:
        type: array
        items:
          $ref: "#/$defs/edit"
  edit:
    title: Edit
    description: An entry from `edits.jsonl`, with legacy permission fields converted to `allowed_by`.
    type: object
    additionalProperties: false
    required:
      - id
      - time
      - location
      - allowed_by
      - before
      - before_digest
      - after_digest
    properties:
      id:
        $ref: common.schema.yaml#/$defs/edit_id
      time:
        $ref: common.schema.yaml#/$defs/time
      location:
        $ref: common.schema.yaml#/$defs/location
      allowed_by:
        $ref: document-types.schema.yaml#/$defs/allowed_by
      whole_file:
        description: Present when `before` is the whole file.
        const: true
      before:
        description: The replaced text, or an empty string for a new file.
        type: string
      before_digest:
        $ref: common.schema.yaml#/$defs/digest
      after:
        description: >-
          Absent when the kb_record_edit call for a whole-file
          edit sent `after_digest` and no `after`.
        type: string
      after_digest:
        $ref: common.schema.yaml#/$defs/digest
