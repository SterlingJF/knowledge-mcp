---
$schema: https://json-schema.org/draft/2020-12/schema
$id: document-types-update.schema.yaml
title: kb_prepare_document_types result
description:
  The structuredContent of a kb_prepare_document_types result, or problem
  details when isError is true.
type: object
oneOf:
  - $ref: "#/$defs/answer"
  - $ref: problem.schema.yaml
$defs:
  answer:
    title: Document types update answer
    type: object
    additionalProperties: false
    required:
      - schema
      - location
      - based_on
      - record
      - digest
      - changed
      - to_settle
      - scopes
      - received
      - filing
    properties:
      schema:
        const: knowledge-mcp/document-types-update/1
      location:
        $ref: common.schema.yaml#/$defs/location
      based_on:
        description:
          Digest of the document-types text sent as `record`, or named
          by `record_digest`.
        $ref: common.schema.yaml#/$defs/digest
      record:
        description:
          The merged text for the harness to save as `document-types.yaml`.
          Null when the call sent no `allowed_by`, or when no entry changed and the
          text sent was not an old `record.yaml`.
        type:
          - string
          - "null"
      digest:
        description:
          Digest of `record`, or null when `record` is null. Send a non-null
          digest as `record_digest` in the next call.
        type:
          - string
          - "null"
        pattern: ^sha256:[0-9a-f]{64}$
      note:
        description:
          Present when changes or migration lack `allowed_by`, or when
          `record` replaces an old `record.yaml`.
        type: string
      listing_changes:
        description:
          Observed events from comparing the complete listing with saved entries.
          Present when the call sent `listing`. Retain these events through follow-up
          classification and naming-value calls. Edited events include first-fingerprint
          baseline updates.
        type: array
        items:
          $ref: common.schema.yaml#/$defs/file_change
      changed:
        description:
          Prepared entry changes, including classifications, moves, deletions and
          fingerprint updates. Use listing_changes to count observed arrivals.
        type: array
        items:
          title: Changed entry
          type: object
          additionalProperties: false
          required:
            - path
            - change
          properties:
            path:
              $ref: common.schema.yaml#/$defs/path
            change:
              description:
                knowledge-mcp retains every classification field when the
                universe spec and document type apply at the destination. After a
                conflicting move, knowledge-mcp retains the original entry and lists
                the destination in to_settle. Other values name classification, deletion
                or fingerprint updates.
              enum:
                - settled
                - corrected
                - moved
                - deleted
                - kept
                - fingerprint
            old_path:
              $ref: common.schema.yaml#/$defs/path
            entry:
              $ref: document-types.schema.yaml#/$defs/entry
            was:
              $ref: document-types.schema.yaml#/$defs/entry
            note:
              type: string
      to_settle:
        description:
          Files that need a document type from the agent, with candidates
          in kb_get_document_type order.
        type: array
        items:
          title: File to settle
          type: object
          additionalProperties: false
          required:
            - path
            - scope
            - candidates
          properties:
            path:
              $ref: common.schema.yaml#/$defs/path
            scope:
              description: The index into `scopes`.
              type: integer
              minimum: 0
            candidates:
              type: array
              items:
                $ref: common.schema.yaml#/$defs/candidate
            old_path:
              $ref: common.schema.yaml#/$defs/path
            was:
              $ref: document-types.schema.yaml#/$defs/entry
      scopes:
        description:
          Groups of universe specs that apply, one group for each set of
          sent `.knowledge-bus/` folders above a file.
        type: array
        items:
          title: Scope
          type: object
          additionalProperties: false
          required:
            - universe_specs
            - every_document_type
          properties:
            universe_specs:
              type: array
              items:
                $ref: common.schema.yaml#/$defs/spec
            every_document_type:
              description:
                Null unless a `to_settle` file references this group through
                `scope` and has no candidate matching its file name.
              type:
                - array
                - "null"
              items:
                $ref: common.schema.yaml#/$defs/type_group
      received:
        $ref: common.schema.yaml#/$defs/received
      filing:
        description:
          Assessments for saved entries and candidate types. Join by current path,
          universe spec and chosen document type. Candidate assessments remain
          conditional until the document type is chosen. Keep the complete array
          when capping a conversational preview.
        type: array
        items:
          $ref: common.schema.yaml#/$defs/filing_assessment
      filing_review:
        title: Folder filing review
        type: object
        additionalProperties: false
        required:
          - folder
          - recursive
          - assessments
          - unresolved
        properties:
          folder:
            type: string
          recursive:
            type: boolean
          assessments:
            type: array
            items:
              $ref: common.schema.yaml#/$defs/filing_assessment
          unresolved:
            type: array
            items:
              title: Unresolved filing
              type: object
              additionalProperties: false
              required:
                - path
                - question
              properties:
                path:
                  $ref: common.schema.yaml#/$defs/path
                question:
                  type: string
