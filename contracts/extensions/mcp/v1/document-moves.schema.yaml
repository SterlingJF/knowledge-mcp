---
$schema: https://json-schema.org/draft/2020-12/schema
$id: document-moves.schema.yaml
title: kb_prepare_document_moves result
type: object
oneOf:
  - $ref: "#/$defs/answer"
  - $ref: problem.schema.yaml
$defs:
  answer:
    title: Document moves answer
    type: object
    additionalProperties: false
    required:
      - schema
      - location
      - status
      - allowed_by
      - search
      - based_on
      - writes
      - record
      - digest
      - links
      - issues
      - received
      - moves
      - affected_documents
      - record_changes
    properties:
      schema:
        const: knowledge-mcp/document-moves/1
      location: &id001
        type: string
      status:
        enum:
          - texts_needed
          - permission_needed
          - ready
          - blocked
          - unchanged
      allowed_by:
        anyOf:
          - $ref: document-types.schema.yaml#/$defs/allowed_by
          - type: "null"
      search:
        description:
          Fixed strings to search case-insensitively across Markdown files; echo
          the complete array after searching.
        type: array
        items: *id001
      based_on:
        description: Input digests for the agent to recheck before applying writes.
        title: Move inputs
        type: object
        additionalProperties: false
        required:
          - listing_digest
          - record_digest
          - documents
          - configuration
        properties:
          listing_digest: &id002
            $ref: common.schema.yaml#/$defs/digest
          record_digest: *id002
          documents:
            type: array
            items:
              title: Document digest
              type: object
              additionalProperties: false
              required:
                - path
                - digest
              properties:
                path: &id004
                  $ref: common.schema.yaml#/$defs/path
                digest: *id002
          configuration:
            $ref: common.schema.yaml#/$defs/received
      writes:
        description: Prepared document replacements for the agent to apply as one operation with `record`.
        type: array
        items:
          $ref: "#/$defs/write"
      record:
        description:
          Prepared document-types text for the agent to save with the document
          writes, or null when no writes are prepared.
        type:
          - string
          - "null"
      digest:
        type:
          - string
          - "null"
        pattern: ^sha256:[0-9a-f]{64}$
      links:
        type: array
        items:
          $ref: "#/$defs/link"
      issues:
        type: array
        items:
          $ref: "#/$defs/issue"
      received:
        $ref: common.schema.yaml#/$defs/received
      moves:
        type: array
        items:
          $ref: common.schema.yaml#/$defs/document_move
        uniqueItems: true
      affected_documents:
        type: array
        items:
          $ref: common.schema.yaml#/$defs/document_move
      record_changes:
        type: array
        items:
          $ref: common.schema.yaml#/$defs/document_move
      summary:
        description: What the moves are for, in one line, echoed from the `summary` argument.
        type: string
        minLength: 1
      folder:
        description: The folder the moved files come from, echoed from the `folder` argument.
        type: string
        minLength: 1
      stays:
        description: Files left where they are, with reasons, echoed from the `stays` argument.
        type: array
        items:
          $ref: "#/$defs/move_stay"
      naming:
        description: The naming rule behind each named destination, echoed from the `naming` argument.
        type: array
        items:
          $ref: "#/$defs/move_naming"
      card:
        description: >-
          The move plan as markdown. Show it in your reply unchanged, unless your app already draws it
          as a card.
        type: string
        minLength: 1
    if:
      type: object
      required:
        - status
      properties:
        status:
          enum:
            - texts_needed
            - permission_needed
            - blocked
            - unchanged
    then:
      type: object
      properties:
        writes:
          type: array
          maxItems: 0
        record:
          type: "null"
        digest:
          type: "null"
    else:
      type: object
      properties:
        writes:
          type: array
          minItems: 1
        record:
          type: string
        digest:
          $ref: common.schema.yaml#/$defs/digest
  write:
    title: Move write
    type: object
    additionalProperties: false
    required:
      - old_path
      - path
      - before_digest
      - after_digest
      - text
    properties:
      old_path:
        $ref: common.schema.yaml#/$defs/move_path
      path:
        $ref: common.schema.yaml#/$defs/move_path
      before_digest: *id002
      after_digest: *id002
      text: *id001
  link:
    title: Move link
    type: object
    additionalProperties: false
    required:
      - source_path
      - start
      - end
      - target_before
      - target_after
      - replacement
    properties:
      source_path:
        $ref: common.schema.yaml#/$defs/move_path
      start:
        description: Zero-based Unicode code-point offset of the complete link token in the original supplied text.
        type: integer
        minimum: 0
      end:
        description: Exclusive Unicode code-point offset after the complete original link token.
        type: integer
        minimum: 0
      target_before: *id004
      target_after: *id004
      replacement:
        description: The complete replacement link token, or null when the original token needs no change.
        type:
          - string
          - "null"
      line:
        description: >-
          One-based line number of the link token in its source note. Present when the source text was supplied.
        type: integer
        minimum: 1
      text:
        description: >-
          The original link token exactly as written, such as `[[retire-evening]]`. Present when the source text
          was supplied.
        type: string
        minLength: 1
  issue:
    title: Move issue
    type: object
    additionalProperties: false
    required:
      - code
      - source_path
      - start
      - end
      - detail
    properties:
      code: *id001
      source_path:
        type:
          - string
          - "null"
      start:
        type:
          - integer
          - "null"
        minimum: 0
      end:
        type:
          - integer
          - "null"
        minimum: 0
      detail: *id001
      line:
        description: >-
          One-based line number of the link token for a `link-*` issue. Present when the source text was supplied.
        type: integer
        minimum: 1
      text:
        description: The link token exactly as written for a `link-*` issue. Present when the source text was supplied.
        type: string
        minLength: 1
      choices:
        description:
          Resolutions the server can compute for this issue. Absent when it can
          compute none.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/choice"
  move_stay:
    title: Move stay
    description: A file the assistant leaves where it is, with the reason the person sees.
    type: object
    additionalProperties: false
    required:
      - path
      - reason
    properties:
      path:
        $ref: common.schema.yaml#/$defs/move_path
      reason:
        description: Why the file stays, such as `no document type`.
        type: string
        minLength: 1
  move_naming:
    title: Move naming
    description: The naming rule or convention that produced a move's destination name.
    type: object
    additionalProperties: false
    required:
      - path
      - rule
    properties:
      path:
        description: The destination `path` of one move in `moves`.
        $ref: common.schema.yaml#/$defs/move_path
      rule:
        description: The rule in a few words, such as `date + title`.
        type: string
        minLength: 1
  choice:
    title: Move issue choice
    type: object
    additionalProperties: false
    required:
      - action
      - path
    properties:
      action:
        description:
          "`skip_move` drops the move of `path` from `moves`. `bind_link` sends a
          binding for the issue's link with `path` as its target."
        enum:
          - skip_move
          - bind_link
      path:
        $ref: common.schema.yaml#/$defs/move_path
description:
  Prepared replacement text and link target checks against supplied inputs for moves
  prepared together. The agent applies the moves and verifies the saved files.
