[project]
name = "workspace"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
  "actionlint-py==1.7.12.25",
  "datamodel-code-generator[ruff]==0.85.0",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "ruff==0.17.1",
  "shellcheck-py==0.11.0.1",
  "tombi==1.8.6",
  "types-jsonschema==4.26.0.20261006",
  "types-pyyaml==6.0.12.20260906",
  "vulture==2.16",
  "yamllint==1.38.0",
]

[tool.uv]
package = false
required-version = ">=0.12.17"
# Matches minimumReleaseAge in pnpm-workspace.yaml.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["runtime"]

[tool.datamodel-codegen]
input-file-type = "jsonschema"
output = "runtime/knowledge_mcp/models_auto"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.14"
use-annotated = true
use-standard-collections = true
use-union-operator = true
field-constraints = true
enum-field-as-literal = "all"
use-double-quotes = true
disable-timestamp = true
use-schema-description = true
# Put field descriptions in Field(description=...), so they reach the MCP tool schemas.
use-field-description = false
extra-fields = "forbid"
use-title-as-name = true
use-type-alias = true
formatters = ["ruff-format"]
custom-file-header = "# Generated from contracts/extensions/mcp/v1 by just generate_contract_types. Edit the schemas, not this file."

[tool.mypy]
files = ["runtime/knowledge_mcp"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.vulture]
paths = ["runtime/knowledge_mcp", "runtime/tests"]
exclude = ["runtime/knowledge_mcp/models_auto/"]
# Decorators register these functions, so they have no direct caller.
ignore_decorators = [
  "@click.*",
  "@*.command",
  "@*.group",
  "@*.tool",
  "@model_validator",
  "@field_validator",
  "@pytest.fixture"
]
ignore_names = [
  # Read by Pydantic.
  "model_config",
  # pytest hook in conftest.py.
  "pytest_addoption",
  # Click reads or calls these names on the Command and Group subclasses in cli.py and on their options.
  "collect_usage_pieces",
  "command_class",
  "format_help",
  "group_class",
  "help",
  "list_commands",
]
