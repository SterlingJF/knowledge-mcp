elements:

  product-vision:
    - { kind: convention, source: pichler,
        claim: "Describe the change the work should make in the world, and leave the offering itself out of it." }
    - { kind: pitfall, source: asserted,
        claim: "A vision written on its own, with no strategy beside it, says where to go but not how. Write it as the opening of a strategy, alongside the segments, value proposition and trade-offs." }
    - { kind: boundary, source: asserted,
        claim: "Per-product visions nest under the company vision; left unnested they compete with it." }

  positioning-statement:
    - { kind: convention, source: moore,
        claim: "For [segment] who [need], X is a [category] that [benefit], unlike [alternative]." }
    - { kind: pitfall, source: asserted,
        claim: "Brand-led organisations treat this as marketing's asset and product-led ones as product's. Settle ownership before it gets written twice." }
    - { kind: empty, source: asserted, when: { maturity: [unproven] },
        claim: "Pre-competition work often cannot fill the 'unlike' clause honestly. Leave it empty rather than fake it." }

  customer-segments:
    - { kind: pitfall, source: asserted,
        claim: "Segment by shared job or behaviour, not demographics alone — demographic-only segments are the classic false-precision trap." }
    - { kind: pitfall, source: asserted,
        claim: "In B2B the buyer, the user and the payer differ; healthtech's patient/provider/payer triangle makes single-segment framing misleading." }
    - { kind: pitfall, source: asserted, when: { maturity: [unproven] },
        claim: "One beachhead segment. A long segment list this early signals unvalidated focus." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Canonical Model: a segment here is a group of people the offering is for; a category there is one the system uses to sort its own data, such as account types. Ask whether it is about whom we serve or how the system files things." }

  value-proposition:
    - { kind: heuristic, source: asserted,
        claim: "Always relative to the segment's current alternative, including doing nothing." }
    - { kind: pitfall, source: asserted,
        claim: "One per segment. A single all-segment value proposition usually means the segments were never really split." }
    - { kind: heuristic, source: asserted, when: { uptake: [bought] },
        claim: "Quantify in time, cost or risk. Where there is no market, qualitative is fine — but still name the alternative." }

  case-for-change:
    - { kind: heuristic, source: asserted,
        claim: "Say why now: what changed that makes the work worth doing at this point." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Value Proposition: the value proposition says why a segment would choose the offering over its alternatives; the case for change says why the work is worth doing now. Ask whose reason it is: the people the offering is for, or whoever commits time and money to the work." }

  problem-statement:
    - { kind: heuristic, source: asserted,
        claim: "Name the problem and whose problem it is, with no solution built in." }
    - { kind: pitfall, source: asserted,
        claim: "Solution-shaped problems pre-commit the answer." }
    - { kind: heuristic, source: asserted,
        claim: "One quantified pain beats five asserted ones." }

  solution-overview:
    - { kind: boundary, source: asserted,
        claim: "Distinct from Components & Responsibilities and the other architecture elements. Ask whether a line says what the solution does and how people use it, or how it technically holds together; the second belongs there." }
    - { kind: convention, source: lean-canvas,
        claim: "A Lean Canvas keeps this deliberately thin — top features only; a design document gives it a full section." }
    - { kind: heuristic, source: asserted,
        claim: "State what the solution deliberately does not do. Pairs with Scope (In / Out)." }

  goals-and-non-goals:
    - { kind: convention, source: ubl,
        claim: "List non-goals beside the goals. Each should be something that could reasonably be a goal and is explicitly chosen not to be; a plain negation such as 'the system should not crash' does not count." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Success Criteria: a goal names what the work aims at; a success criterion sets the observable threshold, with a date, at which the work counts as having met it. A goal given a number and a date has become a success criterion." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Scope (In / Out) and Trade-offs, which also set things aside. Ask what is being set aside: an aim of this work is a non-goal here; a part of the solution goes in Scope's excluded list; a promising direction for the offering as a whole goes in Trade-offs." }

  channels:
    - { kind: convention, source: bmc,
        claim: "Cover every stage at which the offering meets the segment: how they hear of it, weigh it up, buy it, receive it and get support afterwards." }
    - { kind: heuristic, source: asserted,
        claim: "Product-led versus sales-led growth is at bottom a channels choice. Regulated and enterprise markets often have imposed channels — brokers, distributors, procurement — that dominate the design." }
    - { kind: heuristic, source: asserted,
        claim: "For physical goods, delivery and service channels drive cost structure. Link the two." }

  customer-relationships:
    - { kind: convention, source: bmc,
        claim: "For each segment, name the kind of relationship: personal assistance, dedicated personal assistance, self-service, automated service, community or co-creation." }
    - { kind: pitfall, source: asserted,
        claim: "Skipping this hides how you keep people once they arrive. For each segment, say what keeps them coming back or staying." }

  revenue-streams:
    - { kind: convention, source: bmc,
        claim: "Core to the Business Model Canvas and the Lean Canvas. Strategy canvases often omit it, treating monetisation as downstream of positioning." }
    - { kind: heuristic, source: asserted,
        claim: "In regulated industries this is often fixed by regulation or reimbursement codes. Record it as a constraint, not a choice." }
    - { kind: heuristic, source: asserted, when: { maturity: [unproven] },
        claim: "A hypothesis to test, not a plan. Deep tech and hardware commonly defer it until technical maturity." }

  cost-structure:
    - { kind: heuristic, source: asserted,
        claim: "The dominant driver is the insight, not the line items — services and construction run on per-project labour, software on headcount, hardware on cost of goods sold and capex." }
    - { kind: heuristic, source: asserted,
        claim: "Distinguish fixed from variable and note what scales with growth. The growth mechanism can invert the shape." }
    - { kind: heuristic, source: asserted, when: { uptake: [given] },
        claim: "Still applies at personal and household scale, where time is the usual dominant cost." }

  key-resources:
    - { kind: convention, source: bmc,
        claim: "Check all four kinds of key resource: physical, intellectual (brand, patents, data), human and financial." }
    - { kind: heuristic, source: asserted,
        claim: "Deep tech, EV and robotics are dominated by intellectual property and specialised equipment. Licences and certifications carry lead times — flag them early." }
    - { kind: empty, source: asserted,
        claim: "Software businesses often run thin here. Thin is an answer, not a gap." }

  key-activities:
    - { kind: heuristic, source: asserted,
        claim: "List only what you must do yourselves; any activity someone else does for you belongs in Key Partnerships." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Capabilities: activities are what you do, capabilities are what you must be able to do. Strategy canvases use the latter." }

  key-partnerships:
    - { kind: heuristic, source: asserted,
        claim: "For each partner, say what you rely on them for, such as supply, integration, resale or a platform you run on." }
    - { kind: pitfall, source: asserted,
        claim: "For platform-dependent products the platform is a partnership with unilateral terms. Track it as a risk too." }
    - { kind: heuristic, source: asserted,
        claim: "In construction and hardware, partner schedules land directly on the critical path." }

  unfair-advantage:
    - { kind: heuristic, source: asserted,
        claim: "Test each candidate against the question: could a rival copy it or buy it? Forms that often pass are network effects, proprietary data, switching costs, regulatory protection, patents and brand." }
    - { kind: pitfall, source: lean-canvas,
        claim: "The Lean Canvas's hardest block — 'first mover' and 'passion' do not qualify." }
    - { kind: empty, source: asserted, when: { maturity: [unproven] },
        claim: "Early on there is usually none yet. Write 'none yet' when you looked and found nothing, so a reader can tell it apart from one nobody has considered." }

  trade-offs:
    - { kind: convention, source: porter,
        claim: "Record each promising direction the offering refuses. Porter holds that choosing what not to do is the essence of strategy, so a strategy with nothing refused has not yet chosen." }
    - { kind: boundary, source: asserted,
        claim: "Absent from the Business Model Canvas and Lean Canvas by design; core to strategy canvases." }
    - { kind: refresh, source: asserted,
        claim: "Date each refusal and note what it assumed. Revisit it when that changes, for example when a new segment, competitor or capability appears." }

  growth-mechanism:
    - { kind: heuristic, source: asserted,
        claim: "Name the loop — viral, usage, content, referral, sales-led, paid — rather than writing a generic marketing plan. Loops compound; funnels do not." }
    - { kind: heuristic, source: asserted,
        claim: "Consumer runs on virality and habit, B2B on expansion revenue and referenceability; regulated growth is often gated by accreditation cycles." }

  capabilities:
    - { kind: heuristic, source: asserted,
        claim: "The gap is the point: capability named minus capability possessed is the hiring, partnering and timeline reality." }
    - { kind: heuristic, source: asserted,
        claim: "Note the lead time for any ability that is slow to gain, such as a clearance, a certification or a rare skill. It sets the earliest date the strategy can deliver." }

  north-star-metric:
    - { kind: convention, source: north-star,
        claim: "Proxies customer value, not company results. Revenue is an outcome, not a North Star." }
    - { kind: convention, source: ns-one,
        claim: "One per space, at any abstraction, tested by real users, needs and strategy — never by the org chart. Distinct metrics only for genuinely distinct divisions and customer bases." }
    - { kind: convention, source: outcome,
        claim: "A single effort does not get its own North Star. It sets its success criteria on a change in what people do that the effort can influence and that drives the North Star, which Torres calls a product outcome." }
    - { kind: convention, source: omtm,
        claim: "A North Star tracks customer value within its framework. The One Metric That Matters identifies the current metric to focus on and may change with the business stage or bottleneck; the names are not interchangeable." }
    - { kind: convention, source: ns-checklist,
        claim: "Represents vision and strategy without being either — a strong metric statement lets a reader recover both at a high level." }
    - { kind: pitfall, source: asserted,
        claim: "A North Star without input metrics is not actionable." }
    - { kind: boundary, source: asserted,
        claim: "Success Metrics owns the definition. A strategy canvas records the choice and links back rather than restating it, because copies drift." }

  input-metrics:
    - { kind: convention, source: working-backwards,
        claim: "Leading and team-influenceable, or it is an output someone mislabelled." }
    - { kind: heuristic, source: asserted,
        claim: "Few and causal beats many and correlated." }
    - { kind: convention, source: kpi,
        claim: "Where a team already reports KPIs, sort them before reusing any here. Parmenter separates result indicators, which sum up the input of more than one team, from performance indicators, which can be tied to one team; only the second kind can serve as input metrics." }

  guardrail-health-metrics:
    - { kind: heuristic, source: asserted,
        claim: "The counterweight to any target — latency, churn, quality, trust; burnout at personal scale." }
    - { kind: convention, source: guardrail-org,
        claim: "Guardrails that protect the organisation, such as page-load time or revenue, are largely shared across experiments. Define them once, for the whole organisation, and reuse them in every effort." }
    - { kind: pitfall, source: asserted,
        claim: "Experimentation-heavy organisations formalise these as launch blockers; everywhere else they stay implicit until an incident. Write them down first." }
    - { kind: boundary, source: lean-canvas,
        claim: "Distinct from Input Metrics. Ask whether the number should move or hold: an input metric is pushed to move, a guardrail is held within its range. Neither the Business Model Canvas nor the Lean Canvas has a block for guardrails, so keep them in Success Metrics." }

  success-criteria:
    - { kind: pitfall, source: asserted,
        claim: "'Improve X' invites post-hoc rationalisation. Set a threshold and a measurement date." }
    - { kind: heuristic, source: asserted,
        claim: "Per-initiative acceptance, set before the work, expiring with the effort — unlike metrics that run continuously." }
    - { kind: heuristic, source: asserted,
        claim: "A product requirements document's launch 'success metrics' and an OKR's key results belong here: each is a threshold with a date, usually on an input metric." }
    - { kind: heuristic, source: asserted,
        claim: "Point to the shared measures the work must not break instead of copying them, and state in full each threshold this work commits to." }

  market-sizing:
    - { kind: heuristic, source: asserted,
        claim: "Run top-down and bottom-up. They should disagree, and reconciling them is the insight." }
    - { kind: heuristic, source: asserted,
        claim: "As much an investor convention as a planning one. Include it only when the bet's size justifies it." }
    - { kind: pitfall, source: asserted, when: { maturity: [unproven] },
        claim: "Pre-category, point estimates are fiction. Use scenario ranges." }
    - { kind: heuristic, source: asserted,
        claim: "Size the share the offering could realistically win as well as the whole market. The whole market on its own overstates the opportunity." }

  internal-strengths-weaknesses:
    - { kind: boundary, source: asserted,
        claim: "Distinct from Capabilities: this audits the strengths and weaknesses we have now, judged against the work; Capabilities names the abilities a strategy requires, including those still to gain." }
    - { kind: pitfall, source: asserted,
        claim: "Sanitised weaknesses are the most common SWOT failure." }
    - { kind: heuristic, source: asserted,
        claim: "Strengths only count against a stated goal or competitor. Context-free strengths are trivia." }

  external-opportunities-threats:
    - { kind: boundary, source: asserted,
        claim: "Distinct from Macro-Environment Factors, which lists outside conditions lens by lens; this judges which of them, and which competitor moves, help or threaten the work. The same law may appear in both: once as a fact, once as a threat with an owner." }
    - { kind: heuristic, source: asserted,
        claim: "Draw each opportunity and threat from the PESTLE scan or the competitor profiles, and say which one it came from." }
    - { kind: pitfall, source: asserted,
        claim: "A threat with no owner and no trigger gets noticed only once it lands. Carry each threat that needs a response into Risks & Assumptions, where it gets an owner." }

  macro-environment-factors:
    - { kind: convention, source: pestle,
        claim: "Six lenses: political, economic, social, technological, legal, environmental." }
    - { kind: heuristic, source: asserted,
        claim: "Weight by industry — legal and political dominate banking and healthtech, environmental dominates construction and energy, social and technological dominate consumer." }
    - { kind: refresh, source: asserted,
        claim: "Review it after an election, a new law or regulation, or a change in the platforms or technology the work depends on." }
    - { kind: heuristic, source: asserted,
        claim: "Where a condition fixes a limit the work must meet, record it in Constraints too." }
    - { kind: empty, source: asserted,
        claim: "For a lens that was checked and holds nothing that affects the work, write 'nothing found', so a reader can tell it apart from a lens nobody checked." }

  competitor-profile:
    - { kind: heuristic, source: asserted,
        claim: "Per alternative: what it offers, segment overlap, how well it serves those people, pricing where knowable." }
    - { kind: pitfall, source: asserted,
        claim: "Include indirect alternatives and doing nothing. The spreadsheet-and-email incumbent beats most challengers." }
    - { kind: boundary, source: asserted,
        claim: "Sales battlecards are the externalised descendant. Keep evidence separate from spin." }

  jobs-to-be-done:
    - { kind: boundary, source: asserted,
        claim: "Distinct from User / Job Stories: a job holds whatever solution is chosen; a story says what the solution lets a person do. A when / want / so-that line written before any solution exists states a job." }
    - { kind: convention, source: jtbd-hbr,
        claim: "Jobs are circumstance-anchored and stable. Solutions churn; jobs do not." }
    - { kind: convention, source: job-story,
        claim: "The when / want / so-that job-story form captures circumstance better than persona-attached stories." }

  pains-and-gains:
    - { kind: convention, source: vpc,
        claim: "Osterwalder's value-proposition-canvas pairing — pains before, gains after." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Problem Statement: this records what each segment finds frustrating and hopes for, many entries drawn from evidence; Problem Statement names the one problem the work chooses to solve." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Jobs to Be Done: the job is the progress itself; pains are what gets in the way of making it today, and gains are what would make it better." }
    - { kind: pitfall, source: asserted,
        claim: "Source from evidence — interviews, support logs — not empathy-map guessing. Rank by severity times frequency or the list flattens." }

  user-job-stories:
    - { kind: convention, source: job-story,
        claim: "A user story (as-a / I-want / so-that) presumes a persona; a job story (when / I-want / so-I-can) presumes a circumstance. Pick one per document; do not mix." }
    - { kind: heuristic, source: asserted,
        claim: "Acceptance criteria turn a story from a conversation-starter into testable scope." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Jobs to Be Done: ask whether the line names what the solution must let a person do. A story does, and acceptance criteria test it; the job behind it stays true whatever is built." }

  stepwise-trace:
    - { kind: boundary, source: asserted,
        claim: "Distinct from User / Job Stories: a story says what the solution should let a person do, one capability at a time; a trace follows one person through the solution in one circumstance, step by step, joins included." }
    - { kind: heuristic, source: asserted,
        claim: "The joins are the content. No single story contains a seam, and a set of stories does not sum to one trace." }
    - { kind: boundary, source: rust-rfc,
        claim: "Distinct from Solution Overview: a trace follows one person in one concrete circumstance in full detail; the overview outlines all the behaviour at once. Ask whether the text follows one path or covers them all. In a design document, refer to the trace where the RFC template puts its guide-level explanation." }

  risks-and-assumptions:
    - { kind: heuristic, source: asserted,
        claim: "For an assumption, state what is being relied on and how it will be checked. For a risk, state what could happen, its significance, and the response." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Opportunities & Threats: there an outside condition is judged for planning; here anything inside or outside that could harm the work gets a response and someone to handle it." }
    - { kind: convention, source: premortem,
        claim: "Before committing, imagine the work has already failed and have each person write down why. This brings out risks people hesitate to raise." }
    - { kind: convention, source: rust-rfc,
        claim: "The RFC tradition records drawbacks — known, accepted costs — separately from risks, which are uncertainties." }
    - { kind: heuristic, source: asserted, when: { authority: [approve, statutory] },
        claim: "Where an approver or regulator will review the work, date each entry and name its owner and response, so the record can be audited." }

  scope-in-out:
    - { kind: heuristic, source: asserted,
        claim: "Three lists, not two: included, deferred with a revisit trigger, and excluded with the reason." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Trade-offs: scope excludes parts of the solution for this work; Trade-offs refuses directions for the offering as a whole." }
    - { kind: heuristic, source: asserted,
        claim: "The excluded list is the valuable one — it prevents silent re-expansion." }
    - { kind: convention, source: rust-rfc,
        claim: "The deferred list is where natural extensions land — the RFC tradition's future possibilities." }

  constraints:
    - { kind: heuristic, source: asserted,
        claim: "Imposed, not chosen: regulation, budget, deadline, platform, physics." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Cross-Cutting Concerns: a constraint is an imposed limit on the work that no design choice moves — budget, deadline, platform, what the law allows; a cross-cutting concern is an obligation every part of the solution must be designed to meet — security, privacy, accessibility. One law can supply both: a limit here, a property demanded throughout there." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Trade-offs. Mislabelling a choice as a constraint hides a decision." }

  cross-cutting-concerns:
    - { kind: convention, source: ubl,
        claim: "At minimum, say how the solution handles security, privacy and observability (how you will see what it is doing once it runs). Design docs at Google use this section to make sure these are always taken into consideration." }
    - { kind: heuristic, source: asserted, when: { authority: [approve, statutory] },
        claim: "Regulated domains extend the list — compliance, audit, accessibility." }
    - { kind: heuristic, source: asserted,
        claim: "Exists so these get weighed while change is still cheap." }
    - { kind: convention, source: wcag22,
        claim: "Take accessibility requirements from WCAG 2.2, whose success criteria can each be tested; normal text, for example, needs a contrast ratio of at least 4.5:1. They apply to the brand's colours and type like everything else." }

  visual-identity-rules:
    - { kind: boundary, source: asserted,
        claim: "Distinct from Verbal Identity Rules: marks, colour, type and imagery, and how the name is drawn as a logotype, are look; words, voice, naming, standing copy, and how the name is spelled, cased and punctuated in text, are wording. A trademark policy usually splits across both." }
    - { kind: heuristic, source: asserted,
        claim: "A rule set with nothing forbidden is usually not settled yet." }
    - { kind: pitfall, source: nng-moodboard,
        claim: "Mood boards help a team agree on a feeling before any rule exists, and get copied into the rules by mistake. Record only what was adopted: the final colours, type and marks." }
    - { kind: convention, source: design-md,
        claim: "The machine-readable form fixes the order the sections come in, and requires none of them except a primary colour palette." }
    - { kind: convention, source: dtcg,
        claim: "Token formats carry colour, size, type and timing. Icons, accessibility and writing rules fit in none of them, and are no less settled for that." }
    - { kind: heuristic, source: design-md,
        claim: "Name a specific reference rather than a list of adjectives. 'Modern, clean, premium' fits almost anything." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Cross-Cutting Concerns: here go the brand's standing rules for its look; a record that one design meets an obligation such as accessibility goes there. Ask whether the line sets a rule for all material or checks one piece of work." }
    - { kind: empty, source: asserted,
        claim: "Most of these are only partly answered. A settled palette and nothing else is a real answer, not a stub." }

  verbal-identity-rules:
    - { kind: convention, source: hig,
        claim: "Writing sits among the foundations as a peer of colour and typography, not beneath them." }
    - { kind: convention, source: brand-guide,
        claim: "Where the guide is split into a visual branch and a content or messaging branch, as GitLab's Pajamas is, put these rules in the content branch." }
    - { kind: heuristic, source: asserted,
        claim: "The words a brand refuses do as much work as the ones it adopts." }
    - { kind: boundary, source: message-house,
        claim: "Distinct from Positioning Statement and Value Proposition: here goes the approved wording itself, such as boilerplate, taglines and pitches of set lengths. Ask whether you are fixing words or deciding what to claim; deciding what to claim belongs there, and the wording here draws on it without restating it." }
    - { kind: empty, source: asserted,
        claim: "Where wording is decided case by case and no rules exist, note that here, so a reader can tell it apart from rules that exist but have not been collected." }

  alternatives-considered:
    - { kind: boundary, source: madr,
        claim: "Describe and compare the options here, including the chosen option. Decision records the commitment and why it was chosen." }
    - { kind: convention, source: rust-rfc,
        claim: "Standard in RFCs, decision documents and decision records. Describe the options considered, including the chosen option." }
    - { kind: convention, source: y-statement,
        claim: "Naming the rejected options is grammatically obligatory in the Y-statement form — 'and neglected …' — not an optional courtesy to the reader." }
    - { kind: convention, source: spade,
        claim: "Check that the options are feasible, diverse and comprehensive: each could really be done, none is a small variant of another, and together they cover the realistic ways to solve the problem." }
    - { kind: pitfall, source: options-paper,
        claim: "Flanking a preferred course with two deliberately unattractive alternatives simulates choice rather than offering it." }
    - { kind: heuristic, source: asserted,
        claim: "Two honest alternatives beat five straw men. Absence invites re-litigation." }

  decision-criteria:
    - { kind: heuristic, source: asserted,
        claim: "Give each criterion its weight or rank, so a reader can see how conflicting criteria were balanced. State it before the options are scored, not inside the decision's reasoning." }
    - { kind: convention, source: qoc,
        claim: "Criteria are a first-class object, not prose inside the rationale: options are assessed against them, and the assessment carries a sign. That is what lets a later reader see that two decisions were judged against the same criterion, or against conflicting ones." }
    - { kind: convention, source: nepa-rod,
        claim: "Where an outside body may review the decision, name every factor that was balanced and say how each entered the decision. A US Record of Decision had to do exactly this." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Goals & Non-Goals and from Constraints: a criterion is a dimension options are compared along, a goal is an outcome aimed for, and a constraint is a fixed limit that admits no trade-off." }
    - { kind: empty, source: asserted,
        claim: "Honestly empty means the choice was made on one dominant consideration already stated in the decision — not that the criteria were never articulated." }

  decision:
    - { kind: boundary, source: asserted,
        claim: "Distinct from Accepted Consequences: the decision states what is chosen and why ('we drop the evening track because only four signed up'); a consequence is what the choice brings that we accept ('tutors lose Thursday income'). Stating what is chosen is the decision even when it reads as a loss." }
    - { kind: convention, source: adr,
        claim: "One decision per record, dated, and never edited in place: a stale decision is superseded by a new record." }
    - { kind: convention, source: y-statement,
        claim: "Bad rationale has a recognisable shape — 'everybody does it', 'we have always done it like that', 'this will look good on my resume'. Reasoning that survives none of those is not reasoning." }
    - { kind: convention, source: madr,
        claim: "Give the reasons beside the choice, and name the criteria the chosen option met best. MADR's template allows the outcome to cite its decision drivers in this way." }
    - { kind: heuristic, source: tyree-akerman,
        claim: "Name the objective or requirement the decision serves. If it serves none, question whether it needs making at all." }

  accepted-consequences:
    - { kind: convention, source: adr,
        claim: "All consequences belong here, not only the favourable ones — positive, negative and neutral alike. The consequences of one decision commonly become the context of the next." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Reversal Condition: a consequence is what the decision brings, known and accepted when it is taken; a reversal condition is an observation not yet made that would reopen it. A consequence turning out worse than accepted is one such observation." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Trade-offs: a trade-off is a promising direction the offering refuses as part of its strategy; a consequence follows from one decision already taken and is accepted with it. If the entry traces back to a specific decision, it belongs here." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Risks & Assumptions: a consequence is accepted and expected, a risk is uncertain. Filing a known cost as a risk hides that someone chose it." }
    - { kind: empty, source: asserted,
        claim: "An option can outperform every alternative and still have consequences. Distinguish none identified from not assessed; neither follows from the option dominating the comparison." }

  reversal-condition:
    - { kind: heuristic, source: asserted,
        claim: "An observable condition, not a review date: what would have to be seen for this to stop holding. 'Revisit in six months' is a calendar entry; 'if median latency exceeds the budget for two consecutive quarters' is a condition." }
    - { kind: boundary, source: asserted,
        claim: "Checking that a decision was implemented and deciding whether it should change are different activities. Implementation compliance is not itself a condition for reconsideration." }
    - { kind: convention, source: azure-waf,
        claim: "Record uncertainty that may warrant revisiting the decision. New evidence or changed circumstances can justify reconsideration regardless of its original confidence." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Risks & Assumptions: a failing assumption is one trigger among several. A better alternative appearing, a constraint lifting, or an authority changing reopen the decision without any assumption having failed." }
    - { kind: empty, source: asserted,
        claim: "State what would warrant reconsideration. If no trigger has been identified, say so; this does not establish that the commitment is irreversible." }

  prior-art:
    - { kind: heuristic, source: asserted,
        claim: "Say what each precedent teaches the work: what to copy and what to avoid. A list of look-alikes with no lesson is not prior art." }
    - { kind: convention, source: rust-rfc,
        claim: "A standard RFC section: precedent survey across other systems, organisations or communities." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Competitor Profile: that grades how well each alternative serves the people the offering is for; this draws lessons from how others solved similar problems, whether or not they compete. Absence invites reinvention." }

  rollout-and-phasing:
    - { kind: heuristic, source: asserted,
        claim: "Give each stage its audience, such as a pilot group, a wider beta or everyone, and the observation that would stop or roll back the rollout before the next stage." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Sequence & Foreclosure: rollout stages how widely the solution is introduced, with a stopping condition per stage; sequence orders the work's own steps by what each forecloses." }
    - { kind: heuristic, source: asserted,
        claim: "Enterprise implementation practice treats this as a core deliverable section. Product briefs include it only when release risk warrants." }

  sequence-and-foreclosure:
    - { kind: convention, source: bezos-doors,
        claim: "Sort the steps by whether they can be walked back. A step you can reverse is a two-way door and deserves speed; a step you cannot is a one-way door and deserves deliberation. Applying the heavy process to everything is as costly a mistake as applying the light one to the irreversible." }
    - { kind: heuristic, source: asserted,
        claim: "Name what each step forecloses, not merely what it enables. An order that closes no doors is a preference, not a sequence." }
    - { kind: empty, source: asserted,
        claim: "Honestly empty means every step is independently reversible in any order — in which case say so, because that is the licence to move fast." }

  open-questions:
    - { kind: heuristic, source: asserted,
        claim: "Each wants an owner and a resolution path. An unowned question is a risk mislabelled." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Risks & Assumptions: an open question is something to answer before a point can be settled; an assumption is a belief the work proceeds on and checks along the way. Proceeding without the answer turns the question into an assumption." }
    - { kind: heuristic, source: asserted,
        claim: "Compare the list across drafts: it should get shorter. A list that keeps growing means the work is not yet ready to settle." }
    - { kind: empty, source: asserted,
        claim: "Write 'none open' only when every question raised has been answered or recorded as an assumption, so a reader can tell it apart from a list nobody has drawn up." }

  system-boundary-and-context:
    - { kind: convention, source: c4,
        claim: "C4 level 1: the system, its users, and the external systems it exchanges with." }
    - { kind: heuristic, source: asserted,
        claim: "The boundary is a security and ownership decision, not just a drawing choice." }

  components-and-responsibilities:
    - { kind: heuristic, source: asserted,
        claim: "Give each part one responsibility you can state in a single sentence. If the sentence needs an 'and', consider splitting the part." }
    - { kind: pitfall, source: asserted,
        claim: "Drawing the parts of the system on a diagram meant to show only the system and its surroundings makes that diagram hard to read. Keep the system context diagram to the system as one box, and show its parts in the Architecture Overview." }
    - { kind: boundary, source: asserted,
        claim: "Components run and own behaviour. The named categories the system reasons with are Canonical Model." }

  data-flows-and-integrations:
    - { kind: heuristic, source: asserted,
        claim: "Flows name the contract — API, event, file — and the contract's owner." }
    - { kind: heuristic, source: asserted, when: { authority: [approve, statutory] },
        claim: "In regulated and privacy contexts flows are compliance surface. Annotate data classification — personally identifiable information, protected health information — where it applies." }

  canonical-model:
    - { kind: heuristic, source: asserted,
        claim: "Give each category its identifier and the fields its entries carry, so the model fixes the shape of an entry and not only its name." }
    - { kind: convention, source: canonical,
        claim: "Use each category's name the same way everywhere: in conversation, in documents and in the system itself. Keep it stable once other parts depend on it." }
    - { kind: heuristic, source: asserted,
        claim: "Record the categories and their fields, with only as many example entries as a reader needs to understand them. A full list of entries is the offering's data and belongs with it." }
    - { kind: heuristic, source: asserted,
        claim: "Documents that use these categories refer to this model for them, so each category is defined in one place." }

  funding-source:
    - { kind: boundary, source: asserted,
        claim: "Distinct from Revenue Streams: funding pays for the work; revenue is what the offering earns from the people who take it up. Where the offering's own earnings pay for the work, name them here as the source and describe them there." }
    - { kind: heuristic, source: asserted,
        claim: "Record each funder's conditions. Where a condition limits the work, also list it under Constraints, pointing back here instead of restating it." }
    - { kind: heuristic, source: asserted,
        claim: "Count time and in-kind support as funding where no money changes hands. In personal work the funder is usually yourself, in time or savings; write that down, because it is an answer." }

  decision-authority-and-approvals:
    - { kind: heuristic, source: asserted,
        claim: "For each approval, name who gives it and who gave them the right to give it. If nobody holds that right, close the gap before relying on the approval." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Consent & Authority: an approval is a decision someone takes over whether the work goes ahead; a licence, permit, consent or legal basis is the permission the work holds. A regulator can appear in both: as an approval here, as its clearance there." }
    - { kind: empty, source: asserted,
        claim: "If the work needs no one's approval, say so and say how you know, for example that the spend is within your own authority. A blank list with no such note reads as not yet checked." }

  affected-and-interested-parties:
    - { kind: heuristic, source: asserted,
        claim: "List everyone who bears a cost, hazard or loss from the work, including people who never use what it produces, such as the neighbours of a building site." }
    - { kind: empty, source: asserted,
        claim: "If the work's effects fall only on those accountable for it, say so and leave the list empty for that reason. A blank list with no such note cannot show that anyone checked who else carries the work's risks." }
    - { kind: heuristic, source: asserted,
        claim: "For each party, record what claim it has to be heard, such as a legal right, a contract or direct harm. That claim decides whether a risk it carries can be accepted without asking it." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Decision Authority & Approvals: a party here is heard and weighed; an approver there decides whether the work goes ahead. If the work needs their yes, list them there." }

  as-built-survey:
    - { kind: heuristic, source: asserted,
        claim: "Record each finding with how precisely it was measured and when it was observed. An undated survey cannot say whether it still holds." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Constraints: the survey records what is actually in place; a constraint is a limit imposed on the work. A measured clearance is a finding here; a rule forbidding building into it is a constraint." }

  hypothesis:
    - { kind: heuristic, source: asserted,
        claim: "Name the observation that would show the prediction wrong. A prediction no observation could contradict is not testable." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Success Criteria: a success criterion says what counts as the work succeeding; a hypothesis says what the world will show. A test that refutes its hypothesis can still succeed as work, by settling the question." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from Risks & Assumptions: an assumption is something the work relies on; a hypothesis is a prediction stated so a test can show it wrong. Testing an assumption states it as a hypothesis here; the assumption stays in the register until the test settles it." }

  measurement-protocol:
    - { kind: heuristic, source: asserted,
        claim: "Fix the procedure before any data are collected, and say for each thing the prediction names how it becomes a measured quantity: instrument, unit, sample and who records it. A procedure changed after the data arrive turns the test into exploration." }

  brand-character:
    - { kind: convention, source: design-md,
        claim: "The opening Overview of a DESIGN.md carries this: personality, audience and the response the brand should evoke. It is what to fall back on when no rule covers a case." }

artifacts:

  product-strategy-canvas:
    - { kind: heuristic, source: asserted,
        claim: "No standard form fixes this canvas's blocks. Always fill in the vision, segments, value proposition, cost structure, trade-offs, capabilities and the North Star it steers by; once the bet is proven, also the growth mechanism and unfair advantage. Add any other block only when it changes what the offering will aim for or refuse next." }

  business-model-canvas:
    - { kind: convention, source: bmc,
        claim: "Fill in all nine blocks: customer segments, value propositions, channels, customer relationships, revenue streams, key resources, key activities, key partnerships and cost structure." }
    - { kind: heuristic, source: asserted,
        claim: "When a block does not apply, keep it and write in it why it does not apply." }
    - { kind: boundary, source: asserted, when: { maturity: [unproven] },
        claim: "For a new business every block is still a guess, and this canvas checks that the guesses fit together. The Lean Canvas picks which guess to test first; the Startup Canvas commits the venture's aims." }

  lean-canvas:
    - { kind: convention, source: lean-canvas,
        claim: "A one-page adaptation of the Business Model Canvas for ventures under extreme uncertainty." }
    - { kind: convention, source: lean-canvas,
        claim: "Fill in each of these blocks: problem, customer segments, unique value proposition, solution, channels, revenue streams, cost structure, key metrics and unfair advantage." }
    - { kind: heuristic, source: asserted,
        claim: "When a block does not apply, keep it and write in it why it does not apply." }

  startup-canvas:
    - { kind: boundary, source: asserted,
        claim: "The Lean Canvas picks which assumption to test before customers have paid; this canvas commits a forming venture's aims and how it will make money." }

  competitor-analysis:
    - { kind: boundary, source: asserted,
        claim: "Distinct from a sales battlecard, which is written from this analysis to win deals. Ask whether an entry reports how well an alternative serves people or argues for the offering; arguments belong on the battlecard." }

  opportunity-assessment:
    - { kind: convention, source: product-brief,
        claim: "Keep it to one or two pages about the problem, written before any product requirements document." }

  risk-assessment:
    - { kind: convention, source: risk-register,
        claim: "The risk register is standard across PMBOK, PRINCE2 and ISO Guide 73 — a record of information about identified risks." }

  design-doc:
    - { kind: convention, source: ubl,
        claim: "Canonical sections: context and scope, goals and non-goals, the actual design, alternatives considered, cross-cutting concerns. Skip the document when the solution is unambiguous." }
    - { kind: convention, source: hashicorp,
        claim: "Most large projects start with a PRD to define the problem, followed by an RFC to propose a solution." }
    - { kind: convention, source: oxide,
        claim: "The request-for-discussion is the same document family, inspired by the IETF's RFC series." }
    - { kind: pitfall, source: sdd,
        claim: "Do not mistake this for a Solution Design Document, an enterprise-implementation deliverable whose content belongs in the Architecture Overview. A design doc proposes one approach for reviewers to agree to or object to." }

  brand-identity-guide:
    - { kind: boundary, source: asserted,
        claim: "Brand values and purpose belong in the Product Vision and the Positioning Statement. Ask whether a passage says what the brand stands for (put it there) or how the brand should feel and be expressed in look and wording (keep it here)." }
    - { kind: heuristic, source: asserted,
        claim: "Brand guidelines, a brand book and a style guide all count as this guide when they set the brand's intended feeling and its rules for look and wording, whatever the document is called." }
    - { kind: convention, source: design-md,
        claim: "DESIGN.md represents visual design-system rules. It can supply the visual portion of a brand guide; it does not represent its verbal rules." }
    - { kind: pitfall, source: asserted,
        claim: "Instructions for revising the document are not part of the document. That is a process, and it belongs wherever the process is owned." }
    - { kind: refresh, source: asserted,
        claim: "Stale when an adopted colour, typeface, logo or other brand asset changes. A guide that shows a look nobody uses any more misleads more confidently than having no guide." }

  scenario-walkthrough:
    - { kind: convention, source: scenario-walkthrough,
        claim: "Follow one person pursuing one goal, step by step. Use it early to settle what the solution should do, and leave detailed interface design out." }
    - { kind: pitfall, source: asserted,
        claim: "Three unrelated practices share the name: a live usability test with users, an architecture review of quality attributes (ATAM), and a document or code inspection meeting. The walkthrough meant here is a written step-by-step trace of one person reaching one goal; if yours is a meeting or a test session, it is one of the others." }

  success-metrics:
    - { kind: convention, source: north-star,
        claim: "The North Star Metric and the input metrics that drive it." }

  architecture-overview:
    - { kind: convention, source: c4,
        claim: "C4 levels 1 and 2 — system context and containers." }

  system-context-diagram:
    - { kind: heuristic, source: asserted,
        claim: "Record only the flows that cross the system's boundary; flows between the system's own parts belong in the Architecture Overview." }
    - { kind: convention, source: c4,
        claim: "Show people and external systems at C4 level 1. Use the Architecture Overview for internal containers and their interactions at level 2. C4 component-level detail is a further level." }

  decision-brief:
    - { kind: convention, source: daci,
        claim: "Exactly one named decider. Without one, a brief produces discussion rather than a decision." }
    - { kind: convention, source: daci, when: { authority: [approve, statutory] },
        claim: "Beside the decider, list who contributes and who is only informed: contributors give input, those informed do not. Neither decides." }
    - { kind: convention, source: spade,
        claim: "The framing carries a date and the reason for that date. Without a deadline, the brief is only a discussion document." }
    - { kind: convention, source: dq,
        claim: "Quality is judged before the outcome is known, on the frame, the alternatives, the information, the criteria and trade-offs, the reasoning, and the commitment to act — and is no better than the weakest of them." }
    - { kind: convention, source: spade,
        claim: "Finish with a commitment step: until the choice is voiced it is not taken." }
    - { kind: convention, source: spade, when: { authority: [approve, statutory] },
        claim: "Agreement obtained privately and never voiced does not bind, and the decision reopens the first time it meets friction." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from the Decision Record, which it feeds. Ask whether the choice is still to be made: while it is, the criteria and options belong in this brief; once it is made, the Decision Record keeps the options that were rejected and why." }
    - { kind: boundary, source: asserted,
        claim: "Distinct from the Opportunity Assessment, which asks whether to pursue one thing at all, and from the Design Doc, which offers one approach to react to. This one picks among several." }
    - { kind: refresh, source: asserted,
        claim: "It goes stale the moment the decision is taken. Stop editing it then: changing it afterwards reopens a settled choice against criteria that have since moved." }

  decision-record:
    - { kind: convention, source: adr,
        claim: "One decision per record — context, decision, status, consequences — with status moving proposed to accepted to deprecated or superseded." }
    - { kind: convention, source: azure-waf,
        claim: "The set of records is an append-only log. An accepted record is not edited; a changed decision is a new record that supersedes the old one, with the two linked, so the history of the thinking survives the change of direction." }
    - { kind: heuristic, source: asserted,
        claim: "Write a record when someone will later need the reasoning without its author there to explain it, or when the decision would be costly to undo." }
    - { kind: convention, source: iso-42010,
        claim: "ISO 42010 weighs a decision by impact and cost of change: many stakeholders affected, expensive to enforce, costly to reverse, non-obvious reasoning, major expenditure. Only one of those is about architecture." }
    - { kind: convention, source: nygard-any,
        claim: "The form is not architecture-specific and never was. The same record shape serves a pricing, hiring or procurement decision; what changes with the domain is which decisions merit a record and what the record points at." }
    - { kind: boundary, source: adr-boundary,
        claim: "A decision record that grows into a design guide has stopped being a decision record." }
    - { kind: refresh, source: asserted,
        claim: "Reassess when an observation named in the Reversal Condition occurs, or when the circumstances the decision rested on change. If the condition cannot be checked, find out what evidence is missing." }
