guidance:
  id: product-development-guidance
  label: Product development — type guidance
  version: 0.8
  conforms_to: kbp/0.8
  guides: product-development

guidance_kinds:
  - { id: convention, sourced: true }    # the established form, per an external authority
  - { id: pitfall,    sourced: false }   # a named, recurring failure mode
  - { id: heuristic,  sourced: false }   # a quality bar with no external authority
  - { id: empty,      sourced: false }   # what an honest empty answer means
  - { id: refresh,    sourced: false }   # what makes this stale
  - { id: boundary,   sourced: false }   # the reason behind a declared distinct-from edge

