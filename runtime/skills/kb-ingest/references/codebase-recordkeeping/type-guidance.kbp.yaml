guidance:
  id: codebase-recordkeeping-guidance
  label: Codebase recordkeeping type guidance
  version: 0.1
  conforms_to: kbp/0.8
  guides: codebase-recordkeeping

guidance_kinds:
  - { id: advice, sourced: true }        # a rule or recommendation from an A or B source
  - { id: placement, sourced: true }     # a forge or tool feature that reads, shows or supports the document
  - { id: practice, sourced: true }      # a habit of surveyed projects, practitioners or a studied sample
  - { id: dispute, sourced: true }       # a point where sources or practitioners disagree
  - { id: distinction, sourced: true }   # the difference between two document types or elements

