[project]
name = "knowledge-mcp"
version = "0.4.0"
description = "Plain, structured thinking while you work. It's free, open, and local-first."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Sterling Freeman", email = "sterling.j.freeman@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
  # Click rejects abbreviated options by default.
  "click==8.5.0",
  "jsonschema==4.26.0",
  "json-five==1.1.2",
  # Provides kbp. After changing this pin, run uv lock, then `just refresh_knowledge_model <tag>`.
  "knowledge-bus @ https://github.com/SterlingJF/knowledge-bus/releases/download/v0.10.0/knowledge_bus-0.10.0.tar.gz",
  "mcp==2.2.0",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[project.scripts]
kb = "knowledge_mcp.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
  "knowledge_mcp",
  "knowledge-bus",
  "skills",
  "README.md",
  "pyproject.toml"
]

[tool.hatch.build.targets.wheel]
packages = ["knowledge_mcp"]

# An installed kb loads the bundled universe specs and skills from inside the package.
[tool.hatch.build.targets.wheel.force-include]
"knowledge-bus" = "knowledge_mcp/knowledge-bus"
"skills" = "knowledge_mcp/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:knowledge_mcp.*"]
