universe:
  id: codebase-recordkeeping
  label: Codebase recordkeeping
  version: 0.1
  conforms_to: kbp/0.8
  ordering_frame: step
  overview:
    covers: >
      The written documents of a codebase: files in its repository, commit messages, change
      descriptions, issue reports and release notes.
    for: >
      Anyone who uses, changes, maintains, redistributes or funds a software project, and the
      coding agents that work on the project's code.
    excludes: >
      The source code itself, files generated by build tools, and files that contributors usually
      keep out of the repository, such as personal working notes and drafts.
  terms:
    - { term: user, means: "A person who uses the project's software." }
    - { term: contributor, means: "Anyone who sends a change to the project." }
    - { term: maintainer, means: "A person who can approve changes to the project's files." }
    - { term: change, means: "One set of edits to the project's code, build files or documentation that a contributor sends for review." }
    - { term: release, means: "A bundle of the software that the maintainers publish for users, such as a package or a program file." }
    - { term: version, means: "The identifier of one release, such as 2.1.0." }

statuses: []

frames:

  - id: step
    code: fh4x9
    role: ordering
    set_by: universe
    attaches_to: element
    question: "At which step of working with the project does the reader need this answer?"
    values:
      - { id: choose, question: "Is the reader deciding whether to use, fund or rely on the project?" }
      - { id: use, question: "Is the reader installing or running the software, or notifying the maintainers of a vulnerability?" }
      - { id: propose, question: "Is the reader taking part in discussions or proposing a change?" }
      - { id: build, question: "Is the reader writing or testing code in a local copy?" }
      - { id: review, question: "Is the reader deciding whether to accept or keep a change, or whom to ask for approval?" }
      - { id: release, question: "Is the reader publishing a release, deciding whether to move to a newer release, or distributing a copy of the software?" }

  - id: issue-kind
    code: fg9aa
    role: selection
    set_by: instance
    question: "Which kind of issue did the reporter open?"
    values:
      - { id: bug-report, question: "Does the issue report a fault in the software, such as a crash, a wrong result or a failed build?" }
      - { id: feature-request, question: "Does the issue ask for a new feature or a different behaviour?" }
      - { id: docs-report, question: "Does the issue report missing or wrong documentation?" }
      - { id: question, question: "Does the issue ask how to use the software?" }
      - { id: maintainer-task, question: "Does a maintainer use the issue to plan or track work, such as preparing a release?" }

  - id: docs-task
    code: f4ep7
    role: selection
    set_by: instance
    question: "Which task does the documentation page help the user complete?"
    values:
      - { id: install, question: "Does the page help the user install the software?" }
      - { id: get-started, question: "Does the page lead a new user to a first working result?" }
      - { id: configure, question: "Does the page list the settings a user can change?" }
      - { id: use, question: "Does the page show how to use one feature?" }
      - { id: look-up, question: "Does the page describe each command or function the software offers?" }
      - { id: fix-an-error, question: "Does the page help the user fix an error or a known problem?" }
      - { id: upgrade, question: "Does the page help the user upgrade to a newer release?" }

  - id: contributor-assertion
    code: ffc3j
    role: gating
    set_by: scope
    question: "How does a contributor confirm the right to submit each change?"
    values:
      - { id: sign-off, question: "Must each commit carry a sign-off line?" }
      - { id: agreement, question: "Must each contributor sign a licence agreement once?" }
      - { id: none, question: "Can a contributor send changes without a sign-off line or a signed licence agreement?" }

  - id: repository-state
    code: f5zhh
    role: applicability
    set_by: scope
    question: "Is the repository active or archived?"
    values:
      - { id: active, question: "Can people still open issues, send changes and publish releases?" }
      - { id: archived, question: "Has a maintainer made the repository read-only?" }

factors:

  - id: notes-writing
    code: km66f
    set_by: scope
    question: "Which person or tool writes the release notes?"
    values:
      - { id: by-hand, question: "Does a maintainer write every line of the notes for each release?" }
      - { id: generated, question: "Does a tool build the notes from change titles or commit messages?" }
      - { id: generated-then-edited, question: "Does a maintainer edit notes that a tool built?" }
      - { id: from-change-notes, question: "Does a tool collect the note each contributor writes with a change?" }

  - id: notes-place
    code: k3jgv
    set_by: scope
    question: "Where do the release notes appear?"
    values:
      - { id: release-page, question: "Do the notes appear only on the release page?" }
      - { id: changelog-file, question: "Do the notes appear only in a changelog file in the repository?" }
      - { id: both, question: "Do the notes appear on the release page and in a changelog file?" }

  - id: commit-convention
    code: kycrv
    set_by: scope
    question: "Which convention do the subject lines of commit messages follow?"
    values:
      - { id: conventional, question: "Does each subject line start with a change type, such as fix or feat?" }
      - { id: area-prefix, question: "Does each subject line start with the name of a code area, such as a folder or module?" }
      - { id: free-form, question: "Does each author choose the opening words of the subject line?" }

  - id: version-pattern
    code: kvw9x
    set_by: scope
    question: "Which pattern do the project's version numbers follow?"
    values:
      - { id: major-minor-patch, question: "Does each version have three numbers, such as 2.1.0?" }
      - { id: calendar, question: "Does each version start with a year, such as 2026.9.0?" }
      - { id: other, question: "Does each version follow another pattern, such as two numbers or a named build?" }

no_artifact:
  when: { repository-state: [archived] }

relation_kinds:
  - id: distinct-from
    ordered: false
    phrasing:
      forward: Serves a different purpose from
  - id: feeds
    ordered: true
    phrasing:
      forward: May inform
      reverse: May be informed by

elements:

  - { id: project-purpose, code: ea7vc, question: "What does the project do?", step: choose, cardinality: singleton }
  - { id: install-steps, code: ep08a, question: "Which steps install the software?", step: choose, cardinality: singleton }
  - { id: first-result, code: e5n95, question: "How does a new user get a first working result?", step: choose, cardinality: singleton }
  - { id: excluded-uses, code: eexf9, question: "Which uses of the software do the maintainers exclude?", step: choose, cardinality: singleton }
  - { id: project-status, code: e2ztg, question: "Which status does the project or package have, such as active or no longer maintained?", step: choose, cardinality: singleton }
  - { id: help-channel, code: ehv7a, question: "Where does a user or contributor get help?", step: choose, cardinality: singleton }
  - { id: docs-location, code: ehrm3, question: "Where is the full documentation?", step: choose, cardinality: singleton }
  - { id: maintainers, code: esygb, question: "Who maintains the project or package?", step: choose, cardinality: singleton }
  - { id: license-id, code: ew3d1, question: "Which main licence applies to the code?", step: choose, cardinality: singleton }
  - { id: copyright-holder, code: e5vrb, question: "Who holds the copyright in the code?", step: choose, cardinality: singleton }
  - { id: part-licences, code: essvg, question: "Which licence applies to each part of the code outside the main licence?", step: choose, cardinality: per-part }
  - { id: attribution-notices, code: ercka, question: "Which attribution notices must every redistributed copy include?", step: release, cardinality: singleton }
  - { id: bundled-licences, code: emqjp, question: "Which licence applies to each component from another project that the software includes?", step: release, cardinality: per-component }
  - { id: release-version, code: ed5w8, question: "Which version do the release notes describe?", step: release, cardinality: singleton }
  - { id: release-date, code: e25cd, question: "On which date did the maintainers publish the release?", step: release, cardinality: singleton }
  - { id: breaking-change, code: e0xz5, question: "Which existing uses of the software stop working?", step: release, cardinality: singleton }
  - { id: deprecations, code: e5q97, question: "Which features will a later release remove?", step: release, cardinality: singleton }
  - { id: upgrade-steps, code: eckyb, question: "Which steps must a user take to upgrade?", step: release, cardinality: singleton }
  - { id: security-fixes, code: ey09n, question: "Which vulnerabilities does the release fix?", step: release, cardinality: singleton }
  - { id: report-channel, code: epeb7, question: "How does someone report a vulnerability privately?", step: use, cardinality: singleton }
  - { id: report-contents, code: ed5hz, question: "Which facts must a vulnerability report include?", step: use, cardinality: singleton }
  - { id: supported-versions, code: e8ecs, question: "Which versions get security fixes?", step: use, cardinality: singleton }
  - { id: first-reply-days, code: esm74, question: "How many days does a reporter wait for a first reply?", step: use, cardinality: singleton }
  - { id: disclosure-timing, code: ept6e, question: "When do the maintainers publish details of a fixed vulnerability?", step: use, cardinality: singleton }
  - { id: vulnerability-scope, code: e04g7, question: "Which findings count as vulnerabilities?", step: use, cardinality: singleton }
  - { id: contribution-route, code: ewsdg, question: "Where does a contributor propose a change first?", step: propose, cardinality: singleton }
  - { id: change-refusal, code: exkvt, question: "Which changes will the maintainers refuse?", step: propose, cardinality: singleton }
  - { id: required-evidence, code: exkeq, question: "Which evidence must a change include?", step: propose, cardinality: singleton }
  - { id: code-style, code: e9gyn, question: "Which style rules must the code follow?", step: propose, cardinality: singleton }
  - { id: commit-format, code: edxm6, question: "Which format must commit messages follow?", step: propose, cardinality: singleton }
  - { id: ai-use-rules, code: eaa56, question: "Which uses of AI tools do the maintainers accept in a change?", step: propose, cardinality: singleton }
  - { id: ai-duties, code: ezpy1, question: "Which duties does a contributor have for AI-assisted work?", step: propose, cardinality: singleton }
  - { id: change-summary, code: e5var, question: "What does the change do?", step: review, cardinality: singleton }
  - { id: change-reason, code: e81br, question: "Which problem does the change solve?", step: review, cardinality: singleton }
  - { id: change-kind, code: eqrab, question: "Which kind is the change, such as a bug fix or a new feature?", step: review, cardinality: singleton }
  - { id: related-changes, code: ext07, question: "Which earlier issues or changes does the change refer to?", step: review, cardinality: singleton }
  - { id: sign-off, code: e5gtv, question: "Who certifies having the right to submit the change under the project's licence?", step: review, cardinality: singleton, gate: { contributor-assertion: [sign-off] } }
  - { id: unacceptable-behaviour, code: e6vaa, question: "Which behaviour is unacceptable?", step: propose, cardinality: singleton }
  - { id: conduct-report, code: eb6tr, question: "Where does someone report unacceptable behaviour?", step: propose, cardinality: singleton }
  - { id: conduct-consequences, code: eb140, question: "Which consequences follow unacceptable behaviour?", step: propose, cardinality: singleton }
  - { id: conduct-scope, code: e8grn, question: "Which spaces does the code of conduct apply to, such as forums, events or chats?", step: propose, cardinality: singleton }
  - { id: conduct-enforcers, code: ew6qe, question: "Who enforces the code of conduct?", step: propose, cardinality: singleton }
  - { id: generated-files, code: e8hwk, question: "Which files does a tool generate?", step: build, cardinality: singleton }
  - { id: commit-checks, code: eq9fs, question: "Which checks must pass before a commit?", step: build, cardinality: singleton }
  - { id: approval-needed, code: e45j7, question: "Which actions need approval from a person first?", step: build, cardinality: singleton }
  - { id: verification, code: ekt58, question: "How did the contributor check the change?", step: review, cardinality: singleton }
  - { id: unchanged-behaviour, code: exb74, question: "Which behaviour stays the same after the change?", step: review, cardinality: singleton }
  - { id: release-note-line, code: e2rej, question: "Which entry in the release notes describes each change?", step: review, cardinality: per-change }
  - { id: ai-use-record, code: err0q, question: "Which AI tools did the contributor use for the change?", step: review, cardinality: singleton }
  - { id: known-shortcomings, code: e2qng, question: "Which known shortcomings does the change have?", step: review, cardinality: singleton }
  - { id: proposal-motivation, code: eat1a, question: "Which problem does the proposal address?", step: propose, cardinality: singleton }
  - { id: proposed-design, code: eren7, question: "Which design does the proposal recommend?", step: propose, cardinality: singleton }
  - { id: design-goals, code: eq4p4, question: "Which results must the design achieve?", step: propose, cardinality: singleton }
  - { id: design-non-goals, code: e34d5, question: "Which results do the authors leave out of the design on purpose?", step: propose, cardinality: singleton }
  - { id: design-alternatives, code: eqatt, question: "Which other designs did the authors consider?", step: propose, cardinality: singleton }
  - { id: undecided-parts, code: eaws0, question: "Which parts of the design are still undecided?", step: propose, cardinality: singleton }
  - { id: proposal-status, code: ek7em, question: "Which status does the proposal have?", step: propose, cardinality: singleton }
  - { id: release-steps, code: evh6y, question: "Which steps does a maintainer follow to publish a release?", step: release, cardinality: singleton }
  - { id: release-owner, code: esmkz, question: "Who publishes the next release?", step: release, cardinality: singleton }
  - { id: release-schedule, code: ew2h6, question: "When is the next release due?", step: release, cardinality: singleton }
  - { id: components, code: enc53, question: "What does each main part of the code do?", step: build, cardinality: per-part }
  - { id: part-interactions, code: e7bcn, question: "How do the main parts of the code interact?", step: build, cardinality: singleton }
  - { id: folder-purpose, code: em4gd, question: "What does each folder hold?", step: build, cardinality: per-folder }
  - { id: observed-behaviour, code: e0zv0, question: "Which behaviour did the reporter observe?", step: propose, cardinality: singleton }
  - { id: expected-behaviour, code: ezfgy, question: "Which behaviour did the reporter expect?", step: propose, cardinality: singleton }
  - { id: repro-steps, code: engfx, question: "Which steps reproduce the bug?", step: propose, cardinality: singleton }
  - { id: reporter-environment, code: e1ve7, question: "Which setup does the reporter use, such as the software version and the platform?", step: propose, cardinality: singleton }
  - { id: duplicate-search, code: eqrh7, question: "Which existing issues did the reporter check?", step: propose, cardinality: singleton }
  - { id: feature-need, code: eqyv2, question: "Which problem would the requested feature solve?", step: propose, cardinality: singleton }
  - { id: requested-behaviour, code: eszzs, question: "What should the requested feature do?", step: propose, cardinality: singleton }
  - { id: path-approvers, code: e20bf, question: "Which people or teams must approve a change to each file or folder?", step: review, cardinality: per-path }
  - { id: settings-reference, code: ernr7, question: "Which settings does the software accept?", step: use, cardinality: singleton }
  - { id: error-fixes, code: efkvz, question: "How does a user fix a known error?", step: use, cardinality: singleton }
  - { id: docs-version, code: ejm3v, question: "Which release of the software does each documentation page describe?", step: use, cardinality: per-page }
  - { id: funding-links, code: eqrq6, question: "Where can a sponsor give money to the maintainers?", step: choose, cardinality: singleton }
  - { id: sponsored-accounts, code: eyj8d, question: "Which people or organisations does a sponsor pay?", step: choose, cardinality: singleton }
  - { id: planned-work, code: e2n0w, question: "Which work do the maintainers plan next?", step: choose, cardinality: singleton }
  - { id: help-wanted, code: e7rxy, question: "Which planned work do the maintainers ask contributors to help with?", step: choose, cardinality: singleton }
  - { id: declined-ideas, code: ez32h, question: "Which ideas have the maintainers declined?", step: choose, cardinality: singleton }
  - { id: roadmap-date, code: esg2g, question: "When did the maintainers last update the plan for upcoming work?", step: choose, cardinality: singleton }
  - { id: dev-setup, code: eyrb3, question: "How does a contributor set up a local copy for development?", step: build, cardinality: singleton }
  - { id: build-command, code: etxtj, question: "Which commands build the software?", step: build, cardinality: singleton }
  - { id: test-command, code: eafze, question: "Which commands run the tests?", step: build, cardinality: singleton }

artifacts:

  - id: readme
    code: a0afv
    enablement: { action: "decide whether to try the project or one of its packages", actor: "a first-time visitor", timing: "on the first visit to the repository or package" }
    alias: { kind: descriptive, form: "README file at the repository root or at a package root" }
    composition:
      core:
        - project-purpose
      situational:
        - install-steps
        - first-result
        - excluded-uses
        - project-status
        - help-channel
        - docs-location
        - maintainers
        - { element: license-id, mode: links }

  - id: license-file
    code: amqzx
    enablement: { action: "decide whether the licence allows the planned use of the code", actor: "anyone who plans to use, copy or change the code", timing: "before using the code" }
    alias: { kind: descriptive, form: "LICENSE or COPYING file, LICENSES folder, LICENSING.md" }
    composition:
      core:
        - license-id
      situational:
        - copyright-holder
        - part-licences

  - id: release-notes
    code: ag7ak
    enablement: { action: "decide whether to upgrade to a new release", actor: "a user", timing: "when the maintainers publish a release" }
    alias: { kind: descriptive, form: "release notes on a release page; CHANGELOG, NEWS or HISTORY file" }
    composition:
      core:
        - release-version
        - breaking-change
        - { element: release-note-line, mode: links }
      situational:
        - release-date
        - deprecations
        - upgrade-steps
        - security-fixes
        - { element: change-kind, mode: links }

  - id: security-policy
    code: arxv6
    enablement: { action: "report a vulnerability privately to the maintainers", actor: "a person who finds a vulnerability in the software", timing: "before telling anyone else about the vulnerability" }
    alias: { kind: descriptive, form: "SECURITY.md" }
    composition:
      core:
        - report-channel
      situational:
        - report-contents
        - supported-versions
        - first-reply-days
        - disclosure-timing
        - vulnerability-scope

  - id: contributing-guide
    code: am82j
    enablement: { action: "prepare a change the maintainers will accept", actor: "a contributor", timing: "before opening an issue or sending a change" }
    alias: { kind: descriptive, form: "CONTRIBUTING file; AI use policy file" }
    composition:
      core:
        - contribution-route
      situational:
        - change-refusal
        - required-evidence
        - code-style
        - commit-format
        - ai-use-rules
        - ai-duties
        - { element: help-channel, mode: links }
        - { element: dev-setup, mode: links }
        - { element: test-command, mode: links }

  - id: commit-message
    code: addde
    enablement: { action: "decide whether to keep or undo a past change", actor: "a maintainer or contributor", timing: "when reading the project history" }
    alias: { kind: descriptive, form: "commit message" }
    composition:
      core:
        - change-summary
        - change-reason
      situational:
        - change-kind
        - related-changes
        - sign-off
        - { element: breaking-change, mode: links }

  - id: code-of-conduct
    code: atcqv
    enablement: { action: "report unacceptable behaviour by someone taking part in the project", actor: "anyone who takes part in the project", timing: "when the unacceptable behaviour happens" }
    alias: { kind: descriptive, form: "CODE_OF_CONDUCT file; Contributor Covenant" }
    composition:
      core:
        - unacceptable-behaviour
        - conduct-report
      situational:
        - conduct-consequences
        - conduct-scope
        - conduct-enforcers

  - id: agent-instructions
    code: apy7h
    enablement: { action: "follow the project's rules for building, testing and changing the code", actor: "a coding agent", timing: "at the start of each task in the repository" }
    alias: { kind: descriptive, form: "AGENTS.md, CLAUDE.md or another coding tool's instruction file" }
    composition:
      core:
        - { element: build-command, mode: links }
        - { element: test-command, mode: links }
      situational:
        - generated-files
        - commit-checks
        - approval-needed
        - { element: code-style, mode: links }
        - { element: commit-format, mode: links }
        - { element: components, mode: links }
        - { element: folder-purpose, mode: links }

  - id: change-description
    code: an1ag
    enablement: { action: "decide whether to merge a change", actor: "a maintainer", timing: "before merging the change" }
    alias: { kind: descriptive, form: "pull request description, merge request description or CL description; pull request template" }
    composition:
      core:
        - { element: change-summary, mode: links }
        - { element: change-reason, mode: links }
      situational:
        - verification
        - unchanged-behaviour
        - release-note-line
        - ai-use-record
        - known-shortcomings
        - { element: breaking-change, mode: links }
        - { element: change-kind, mode: links }
        - { element: related-changes, mode: links }

  - id: design-proposal
    code: abxr6
    enablement: { action: "accept or reject a proposed design", actor: "the maintainers who decide on designs", timing: "before anyone builds the design" }
    alias: { kind: descriptive, form: "RFC, enhancement proposal or design document in a proposals folder" }
    composition:
      core:
        - proposal-motivation
        - proposed-design
      situational:
        - design-goals
        - design-non-goals
        - design-alternatives
        - undecided-parts
        - proposal-status

  - id: release-procedure
    code: a0e5c
    enablement: { action: "publish a release by following the project's steps", actor: "the maintainer who publishes the release", timing: "when preparing each release" }
    alias: { kind: descriptive, form: "RELEASE.md, RELEASING.md or a release process page" }
    composition:
      core:
        - release-steps
      situational:
        - release-owner
        - release-schedule

  - id: architecture-overview
    code: ad21a
    enablement: { action: "learn how the main parts of the code work together", actor: "a contributor or security reviewer", timing: "before working on an unfamiliar part of the code" }
    alias: { kind: descriptive, form: "ARCHITECTURE.md, an architecture page in the docs, or a design note for one subsystem" }
    composition:
      core:
        - components
      situational:
        - part-interactions
        - { element: folder-purpose, mode: links }

  - id: notice-file
    code: av95p
    enablement: { action: "include the required attribution notices in a redistributed copy of the software", actor: "anyone who redistributes the software, on its own or inside another work", timing: "before distributing the copy" }
    alias: { kind: descriptive, form: "NOTICE file; THIRD_PARTY_NOTICES or THIRD_PARTY_LICENSES file" }
    composition:
      core:
        - attribution-notices
      situational:
        - bundled-licences
        - { element: copyright-holder, mode: links }

  - id: folder-readme
    code: anryx
    enablement: { action: "find the files to read or change in a folder", actor: "a contributor or maintainer", timing: "on first entering the folder" }
    alias: { kind: descriptive, form: "README file in a sub-folder" }
    composition:
      core:
        - folder-purpose
      situational: []

  - id: issue-report
    code: ajpn5
    enablement: { action: "decide whether to fix a reported bug or build a requested feature", actor: "a maintainer", timing: "when a new issue arrives" }
    alias: { kind: descriptive, form: "issue; issue form or issue template" }
    composition:
      core:
        - { element: observed-behaviour, when: { issue-kind: [bug-report] } }
        - { element: repro-steps, when: { issue-kind: [bug-report] } }
        - { element: reporter-environment, when: { issue-kind: [bug-report] } }
        - { element: requested-behaviour, when: { issue-kind: [feature-request] } }
      situational:
        - expected-behaviour
        - duplicate-search
        - feature-need

  - id: code-owners
    code: akbam
    enablement: { action: "find who must approve a change to each file or folder", actor: "a contributor", timing: "before asking for review" }
    alias: { kind: descriptive, form: "CODEOWNERS, OWNERS, OWNERS_ALIASES or owners.yaml file" }
    composition:
      core:
        - path-approvers
      situational: []

  - id: documentation-set
    code: akjt6
    enablement: { action: "complete a task with the software, such as installing it or fixing an error", actor: "a user", timing: "while setting up or using the software" }
    alias: { kind: descriptive, form: "docs folder or documentation site, with INSTALL, getting-started and troubleshooting pages" }
    composition:
      core:
        - { element: settings-reference, when: { docs-task: [configure] } }
        - { element: error-fixes, when: { docs-task: [fix-an-error] } }
        - { element: install-steps, mode: links, when: { docs-task: [install] } }
        - { element: first-result, mode: links, when: { docs-task: [get-started] } }
      situational:
        - docs-version

  - id: funding-file
    code: avggw
    enablement: { action: "give money to the project's maintainers", actor: "a sponsor", timing: "when choosing whom to fund" }
    alias: { kind: descriptive, form: "FUNDING.yml file" }
    composition:
      core:
        - funding-links
      situational:
        - sponsored-accounts

  - id: roadmap
    code: afq1d
    enablement: { action: "choose which planned work to wait for or help build", actor: "a user or contributor", timing: "when planning for the project's next releases" }
    alias: { kind: descriptive, form: "ROADMAP.md or a roadmap page" }
    composition:
      core:
        - planned-work
      situational:
        - help-wanted
        - declined-ideas
        - roadmap-date

