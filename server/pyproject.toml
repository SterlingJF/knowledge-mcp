[project]
name = "server"
version = "0.1.0"
description = "The knowledge-mcp engine: an offline HTTP API over a folder of Markdown files"
authors = [
    {name = "Sterling Freeman",email = "sterling.j.freeman@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.133.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-frontmatter==1.3.0",
    "pyyaml==6.0.3",
    "starlette==1.6.0",
    "structlog==25.5.0",
    "uvicorn==0.34.3",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "pytest==9.1.1",
]
build = [
    "pyinstaller==6.22.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
