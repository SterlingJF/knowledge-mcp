# File: server/pyproject.toml
[project]
name = "knowledge-mcp-server"
version = "0.1.0"
description = "The knowledge-mcp engine: an offline HTTP API over a folder of markdown files"
authors = [
    {name = "Sterling Freeman",email = "sterling.j.freeman@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "pydantic (>=2.11.0,<3.0.0)",
    "pydantic-settings (>=2.8.0,<3.0.0)",
    "python-frontmatter (>=1.1.0,<2.0.0)",
    "structlog (>=25.4.0,<26.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=8.3.5,<9.0.0",
    "ruff>=0.14.0,<0.15.0",
]
build = [
    "pyinstaller==6.22.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

# Ruff — copied from application/backend/pyproject.toml at 4baa5bcf; the deliberate
# divergences are recorded in the package docstrings.

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    "**/.venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "**/node_modules",
    "*_auto.py",
    "**/openapi_client/**.*",
    "venv",
    "**/__init__.py"
]
# Same as Black.
line-length = 88
# Assume Python 3.12.
target-version = "py312"
unsafe-fixes = true
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "PGH003",
  "E501",
  "D103",
  "D101",
  "D100",
  "RET504",
  "ERA001",
  "F401",
  "PTH",
  "N815",
  "RUF002",
  "RUF003",
  "T201",
  "TC002",
  # Added to allow autogenerated models from fastapi code-gen
  "B008",
  "F405",
  "PIE790",
  # `flake8-quotes.inline-quotes="single"` is incompatible with the formatter's
  # `format.quote-style="double"`; disable Q000 and Q003 when using the formatter
  "Q000",
  "Q003",
  "COM812",
  # TID252 Prefer absolute imports over relative imports from parent modules
  "TID252",
  # unable to detect undefined names
  "F403",
  # Missing docstring in public package
  "ANN201",
  # deleting unused variable
  "F841",
  # Docstrings here carry reasoning; a rule demanding one on every accessor and `__init__`
  # produces filler instead.
  "D102",
  "D107",
  # A FastAPI handler returns the model FastAPI validates it into, so its own annotation is `Any`
  # by construction.
  "ANN401",
]
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**" = ["S101", "ANN", "D", "PLR2004", "SLF001", "PLC0415", "ARG001"]
# FastAPI resolves these modules' annotations at runtime, through `get_type_hints`, to build the
# request model and the dependency graph. `flake8-type-checking` on `strict` with `fix = true`
# moves those imports into a `TYPE_CHECKING` block — which type-checks and then fails at import
# with `PydanticUndefinedAnnotation`. Declared once per module rather than as per-line `# noqa`.
"app/routers/*.py" = ["TC001", "TC002", "TC003"]
"app/dependencies.py" = ["TC001", "TC002", "TC003"]
"app/context.py" = ["TC001", "TC002", "TC003"]
"app/factory.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-third-party = [
    "fastapi",
    "pydantic",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header"
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
strict = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
